name: Release head
on:
  push:
    branches: ['release/v*']
permissions:
  contents: read
jobs:
  release-head:
    name: aussiefy-release-head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Check actual release head and squash tree
        env:
          RELEASE_HEAD: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'Release verification'
          git config user.email 'release-check@users.noreply.github.com'
          python scripts/promote.py check --head "$RELEASE_HEAD" --base origin/main --branch "$RELEASE_BRANCH"
