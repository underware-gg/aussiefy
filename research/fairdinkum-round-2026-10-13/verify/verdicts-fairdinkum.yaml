# Verdicts for the fairdinkum round, one per added entry, in the format of the everyday round's verify/BRIEF.md.
# Written by hand from the headword list alone: glosses and triggers in our own words, sources are open
# references. DECISIONS.md lists every headword, including the ones skipped or already covered.
# `evidence: own` means own knowledge of a common term, checked against the cited Wiktionary page.

