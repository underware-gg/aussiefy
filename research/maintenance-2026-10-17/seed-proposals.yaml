- id: wouldnt-shout-shark
  form: '{subj} wouldn''t shout if bitten by a shark'
  concept:
  - STINGY
  frame: clause
  intensity: 4
  incoherence: 4
  vulgarity: 0
  gloss: So stingy that buying a round is out of the question.
  variants: []
  notes: Pun on shouting drinks. The source's couldn't is corrected to wouldn't. Passive wording binds any subject
    without inventing an object pronoun; no actual shark attack is asserted.
  sources:
  - https://learnconversations.com/funny-aussie-old-sayings-and-phrases/
  - https://www.oup.com.au/__data/assets/file/0026/105686/ozwords_april2016.pdf
- id: live-on-smell-oily-rag
  form: live on the smell of an oily rag
  concept:
  - FRUGAL_LIVING
  frame: vp
  intensity: 4
  incoherence: 4
  vulgarity: 0
  gloss: Get by with very little money or other resources.
  variants: []
  notes: Shared with New Zealand English. Living with little is not stinginess, literal odour or mechanical neglect.
  sources:
  - https://learnconversations.com/funny-aussie-old-sayings-and-phrases/
  - https://www.aph.gov.au/parliamentary_business/committees/house_of_representatives_committees?url=cita%2Fcommunity_broadcasting%2Fsubs%2Fsub3.1.pdf
