- id: more-front-than-myer
  form: '{subj} {have} more front than Myer'
  concept:
  - BRAZEN
  frame: clause
  intensity: 4
  incoherence: 4
  vulgarity: 0
  gloss: Openly and shamelessly audacious.
  variants: []
  notes: Front means effrontery, not a shop facade or generic self-confidence. Myer is the store name.
  sources:
