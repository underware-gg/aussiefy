- id: on-your-bike
  form: on your bike
  concept:
  - GO_AWAY
  frame: imperative
  intensity: 3
  incoherence: 3
  vulgarity: 0
  gloss: Go away; a dismissive command.
  variants:
  - on ya bike
  - on yer bike
  notes: Shared with British English. A dismissal, not an instruction to ride a bicycle.
  sources:
