    locator: no worries
  - source: vu-slang
    locator: N
  reasoning: Reassurance, absence of trouble and acknowledgement of thanks fit the existing interjection triggers.
- id: game-as-ned-kelly
  file: aussiefy/data/entries/idioms.yaml
  form: game as Ned Kelly
  concepts_before:
  - BRAVE
  frame: predicate_adj
  decision: selected_sense_supported
  evidence:
  - source: andc-n
    locator: 'Ned Kelly: as game as Ned Kelly'
  reasoning: The BRAVE mapping fits the comparison.
  limits: The source also permits a foolhardy edge; bravery attestation does not require adding recklessness
