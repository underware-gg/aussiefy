- id: a-yarn
  file: aussiefy/data/entries/fairdinkum.yaml
  form: a yarn
  concepts_before:
  - TALL_TALE
  frame: np
  decision: selected_sense_supported
  evidence:
  - source: cambridge-yarn
    locator: STORY
  reasoning: Story/anecdote mapping is supported.
  limits: A yarn can be entertaining without being fabricated. TALL_TALE is a concept label, not evidence every
    yarn is a lie.
- id: a-sleep-out
  file: aussiefy/data/entries/fairdinkum.yaml
  form: a sleep-out
  concepts_before:
  - SLEEPING_PORCH
  frame: np
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: andc-s
    locator: sleepout
  - source: collins-sleepout
    locator: noun sense 3
  reasoning: Sleeping use distinguishes a sleep-out from an arbitrary enclosed porch.
  proposed_action: Remove or qualify the bare 'enclosed porch' trigger. Keep sleeping porch and add explicit
    porch/verandah used as a bedroom. Broaden the gloss to allow non-enclosed accommodation used for sleeping.
- id: sledge
  file: aussiefy/data/entries/classics.yaml
  form: sledge {obj}
  concepts_before:
