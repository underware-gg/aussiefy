    locator: sledge
  reasoning: The documented extension beyond cricket supports general criticism/ridicule triggers, although
    the current gloss is sport-focused.
  proposed_action: Clarify the gloss to include the wider critical/ridiculing sense.
  limits: This is not evidence that all teasing carries sporting intent.
