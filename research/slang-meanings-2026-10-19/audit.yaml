decisions:
- id: swear-blind
  file: aussiefy/data/entries/idioms.yaml
  form: swear blind
  concepts_before:
  - RESOLVE
  frame: vp
  decision: selected_sense_supported
  evidence:
  - source: collins-swear
    locator: emphatic assertion; swear up and down
  reasoning: The RESOLVE concept name is misleading, but its actual assertion triggers fit. Do not change based
    on the identifier alone.
  limits: This is shared British English, not an exclusively Australian coinage. Preserve the following that-clause
    when rendering.
- id: kick-off
  file: aussiefy/data/entries/idioms.yaml
  form: kick off
  concepts_before:
  - FOUND
  frame: vp
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: cambridge-start
    locator: START
  reasoning: An activity can begin; a physical object is assembled. FOUND currently conflates those operations.
  proposed_action: Move this entry to a narrow START_ACTIVITY sense. Do not map 'put together a chair' or literal
    'bring forth a child' to kick off. Preserve the expression.
- id: knock-together
  file: aussiefy/data/entries/idioms.yaml
  form: knock together
  concepts_before:
  - CONSTRUCT
  - FOUND
  frame: vp
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: cambridge-knock
    locator: phrasal verb
  - source: oxford-knock
    locator: sense 1
  reasoning: Its quick, rough assembly sense fits CONSTRUCT examples, but broad FOUND permits neutral creation
    and birth.
  proposed_action: Remove FOUND from this entry; review neutral 'put together' separately from explicitly hasty
    assembly. Retain cobble/slap/throw together mappings.
  limits: A neutral assembly paraphrase can be an intentional embellishment; classify that as stylistic amplification
    rather than proof the expression is false.
- id: mateship
  file: aussiefy/data/entries/phrases.yaml
  form: mateship
  concepts_before:
  - DEVOTION
  frame: np
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: macquarie-mates
    locator: relationship and mutual reliance
  - source: macquarie-mates-2021
    locator: friendship bond
  reasoning: Peer solidarity is narrower than every kind of devotion or loyalty.
  proposed_action: Use a COMRADESHIP sense with comradeship/camaraderie and explicitly peer-qualified solidarity.
    Keep devotion to religion, a cause, a brand or a monarch plain without contextual evidence.
  limits: The two Macquarie pages are one publisher, not independent authorities. Do not infer a mandatory
    male-only restriction from historical discussion.
- id: mob
  file: aussiefy/data/entries/phrases.yaml
  form: mob
  concepts_before:
  - NATION
  frame: np
  decision: needs_further_evidence
  evidence:
  - source: aiatsis-mob
    locator: identity linked to family, place, language and Country
  reasoning: Context supports an Aboriginal English group reference. Bare tribe is not enough to establish
    that context in every document.
  proposed_action: Keep the term. Shape whether bare 'tribe' should remain an embellished paraphrase, receive
    a meaning gate, or require a contextual trigger. Do not replace it globally with a narrower cultural classification.
  limits: Primary usage is positive evidence for one context, not a dictionary definition or disproof of general
    Australian group uses. No automatic change recommended from this evidence alone.
- id: poor-buggers
  file: aussiefy/data/entries/phrases.yaml
  form: poor buggers
  concepts_before:
  - DEAD_PEOPLE
  frame: np
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: oxford-bugger
    locator: sense 2
  - source: cambridge-bugger
    locator: sympathetic person
  reasoning: A sympathetic reference does not itself identify people as dead.
  proposed_action: Separate sympathetic people from DEAD_PEOPLE. Keep 'poor buggers' as a writer option or
    map explicit pity-bearing phrases. It must not erase death information from 'the dead' without the surrounding
    context carrying it.
  limits: The component is attested; complete sympathetic phrase examples exist. This is a trigger-fit issue,
    not a claim the phrase is invented.
- id: brave-bastards
  file: aussiefy/data/entries/phrases.yaml
  form: brave bastard
  concepts_before:
  - SOLDIERS
  frame: np
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: oxford-bastard
    locator: personal reference senses
  - source: cambridge-brave
    locator: adjective
  reasoning: Adding brave asserts courage; replacing a soldier also drops their occupation. Neither component
    establishes soldier as its lexical meaning.
  proposed_action: Retain the expression for explicitly courageous people or writer use. Remove unqualified
    soldier/servicewoman/infantryman/fallen-soldier triggers unless a documented embellishment rule intentionally
    permits both changes.
  limits: Compositional phrase; no source found treating it as an established synonym for soldier. Absence
    of that sense is not proof nobody uses the phrase about soldiers.
- id: for-nothin
  file: aussiefy/data/entries/phrases.yaml
  form: for nothin'
  concepts_before:
  - IN_VAIN
  frame: adv
  decision: selected_sense_supported
  evidence:
  - source: cambridge-for-nothing
    locator: resultless and purposeless senses
  reasoning: The abbreviated form keeps the ordinary for-nothing construction.
  limits: Shared English; word-final spelling is phonetic styling. The payment sense is also real, so do not
    claim every occurrence means failed effort.
- id: for-sweet-bugger-all
  file: aussiefy/data/entries/phrases.yaml
  form: for sweet bugger-all
  concepts_before:
  - IN_VAIN
  frame: adv
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: cambridge-bugger-all
    locator: quantity sense
  - source: oxford-bugger-all
    locator: noun
  - source: greens-temple-black-tide
    locator: Unproductive outing expressed with for sweet bugger all
  reasoning: The exact construction is attested for an unproductive outing, supporting a non-monetary wasted-result
    reading as well as the component quantity sense. The remaining concern is ambiguous causeless-action triggers,
    not a restriction to payment or reward.
  proposed_action: Preserve the established wasted-result use, including appropriate 'in vain' and 'to no avail'
    contexts. Review broad 'for no reason' separately because it can describe an unexplained cause rather than
    an unproductive result; retain the input where context does not resolve that ambiguity. No payment-only
    remapping is justified.
  limits: The literary quotation supports the complete expression in one non-monetary context. It does not
    establish interchangeability with every IN_VAIN trigger. The seven-entry correction count includes this
    narrower trigger-review recommendation, not a finding that the demonstrated wasted-result sense is wrong.
- id: pull-your-head-in
  file: aussiefy/data/entries/phrases.yaml
  form: pull your head in
  concepts_before:
  - MIND_OWN_BUSINESS
  frame: imperative
  decision: selected_sense_supported
  evidence:
  - source: collins-head
    locator: imperative quieting
  - source: farlex-head
    locator: non-interference imperative
  reasoning: The current imperative owner covers stopping intrusive or inappropriate behaviour.
  proposed_action: Optionally add a separate quieting sense without treating every request for silence as a
    rebuke.
  limits: The checked meanings overlap but are not exhaustive; literal head movements must remain literal.
- id: stir-the-possum
  file: aussiefy/data/entries/gapfill.yaml
  form: stir the possum
  concepts_before:
  - STIR
  frame: vp
  decision: selected_sense_supported
  evidence:
  - source: andc-p
    locator: 'possum: stir the possum'
  reasoning: Current trouble/debate gloss and STIR triggers represent a documented provocative use.
  proposed_action: Optional new narrow triggers for provoking debate/controversy or enlivening discussion would
    capture its non-hostile uses.
  limits: Do not equate every interesting conversation with provocation. Current mapping is supported, not
    an urgent defect.
- id: no-worries
  file: aussiefy/data/entries/phrases.yaml
  form: no worries
  concepts_before:
  - NO_PROBLEM
  frame: interjection
  decision: selected_sense_supported
  evidence:
