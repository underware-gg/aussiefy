  - VAGRANT
  frame: np
  status_before: active
  decision: multiple_usages
  evidence:
  - source: andc-s
    locator: swag, swagman paragraph
  evidence_scope: selected lexical sense
  reasoning: The selected travelling-worker/vagrant family is documented. The swag-bearing image is meaningful
    context, not an interchangeable description of every modern travelling employee.
  triggers_before:
    SWAGMAN:
      np:
      - drifter
      - itinerant worker
      - a drifter
      - an itinerant worker
    VAGRANT:
      np:
      - hobo
      - vagrant
      - tramp
      - a hobo
      - a vagrant
      - a tramp
  proposed_action: Retain the expression and historical use; keep cultural localisation distinct from a literal
    assertion about a particular worker’s baggage.
- id: coolibah-tree
  file: aussiefy/data/entries/classics.yaml
