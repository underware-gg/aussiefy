  status_before: active
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: euclid-coolibah
    locator: Coolabah/Coolibah common names and related species
  evidence_scope: selected lexical sense
  reasoning: Stored triggers describe any waterside eucalypt. That does not identify the named coolibah group;
    a river red gum can also stand beside a waterhole.
  triggers_before:
    COOLIBAH:
      np:
      - a eucalyptus by the water
      - a eucalypt by the water
      - a gum tree by the waterhole
  proposed_action: Require the named tree or suitable ecological/cultural context for a factual substitution;
    preserve as deliberate imagery when the selected embellishment policy allows it.
  limits: Do not collapse the common name into exactly one scientific species; related named coolibahs are
    documented.
- id: troopers
