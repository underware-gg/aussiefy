decisions:
- id: squatter
  file: aussiefy/data/entries/classics.yaml
  form: a squatter
  forms_before:
  - a squatter
  concepts_before:
  - SQUATTER_GRAZIER
  frame: np
  status_before: active
  decision: selected_sense_supported
  evidence:
  - source: andc-s
    locator: squatter, pastoral expansion sense
  evidence_scope: selected lexical sense
  reasoning: Cattle-baron mapping fits the documented large-grazier sense. Do not substitute the separate building-occupation
    sense.
  triggers_before:
    SQUATTER_GRAZIER:
      np:
      - cattle baron
      - a cattle baron
  limits: The colonial historical setting is part of the selected localisation; contemporary housing occupation
    is not claimed.
- id: swagman
  file: aussiefy/data/entries/classics.yaml
