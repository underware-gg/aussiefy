- term: squatter
  key: squatter
  origins:
  - extractor_X
  - extractor_Y
  - user_seed
  records:
  - origin: user_seed
    source: Waltzing Matilda
    guidance: 'Two senses, both to be stated in the gloss. Colonial Australia: a settler who took up Crown land
      to graze stock, at first without permission (the user''s point); by the 1890s the word meant the wealthy graziers
      who held those runs, the ''squattocracy'', which is the song''s squatter. Modern general English: someone
      who occupies empty land or a building without permission (not Australian-specific). Dated; no broad triggers.'
  - origin: extractor_X
    text: on_our_selection_ch1
    line: And when Dave wanted to know why Dad didn't take up a place on the plain, where there were no trees to
      grub and plenty of water, Dad would cough as if something was sticking in his throat, and then curse terribly
      about the squatters and political jobbery.
    kind: bush_vocab
    meaning: A large-scale pastoral landholder, originally one who occupied Crown land without title; resented by
      small selectors.
    plain:
    - wealthy ranchers
    - big landowners
    - the landed gentry
    frame: np
    register: dated
    still_heard: Historical; 'squattocracy' still used jokingly.
    confidence: high
    notes: 'Sense shift: modern ''squatter'' usually means an illegal occupant of a building.'
  - origin: extractor_Y
    text: drovers_wife
    line: The drover, an ex-squatter, is away with sheep.
    as_printed: ex-squatter
    kind: bush_vocab
    meaning: A pastoralist holding a large run of land, originally by occupation; later, a wealthy grazier.
    plain:
    - a rancher
    - a big landowner
    - a cattle baron
    frame: np
    register: dated
    still_heard: Historical sense well known from school poetry; 'squattocracy' still used jokingly.
    confidence: high
    notes: '''started squatting here'' = took up land as a pastoralist. Andy''s Gone: ''cheek the squatter''.'
