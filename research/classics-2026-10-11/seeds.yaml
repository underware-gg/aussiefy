# Terms the user asked for (2026-10-11), with their guidance. They go through the same verification as the
# extractors' finds; the verifier treats them as must-decide items and follows the notes on sense and matching.
- term: coolibah tree
  source: Waltzing Matilda
  guidance: "The tree, not bare 'coolibah'. A eucalypt of inland floodplains, so it shouldn't replace any 'tree';
    useful for lookup and explanation, with at most a narrow trigger like 'a eucalyptus by the water'."
- term: billy
  source: Waltzing Matilda
  guidance: "Tin can for boiling water or tea over a campfire ('boil the billy'). Not a household kettle: no bare
    'kettle' trigger; 'a pot of tea over the fire', 'boil water for tea' at most."
- term: jumbuck
  source: Waltzing Matilda
  guidance: "A sheep. Dated bush word: high incoherence, register dated."
- term: tucker
  source: Waltzing Matilda
  guidance: "Food. Already in the dictionary (tucker, FOOD); check the entry, nothing new needed."
- term: tucker bag
  source: Waltzing Matilda
  guidance: "A bag for carrying food on the track. Dated."
- term: waltzing Matilda
  source: Waltzing Matilda
  guidance: "To travel the roads on foot carrying your swag (Matilda = the swag). Dated. As a vp form
    ('go waltzing Matilda'); triggers narrow ('tramp the roads', 'travel on foot with all one owns')."
- term: swagman
  source: Waltzing Matilda
  guidance: "An itinerant rural worker or tramp who carries his swag. Dated. Triggers like 'a tramp', 'a vagrant',
    'a drifter', 'an itinerant worker'."
- term: swag
  source: Waltzing Matilda
  guidance: "A bedroll with one's belongings rolled inside it (still current for a canvas bedroll used camping)."
- term: squatter
  source: Waltzing Matilda
  guidance: "Two senses, both to be stated in the gloss. Colonial Australia: a settler who took up Crown land to
    graze stock, at first without permission (the user's point); by the 1890s the word meant the wealthy graziers
    who held those runs, the 'squattocracy', which is the song's squatter. Modern general English: someone who
    occupies empty land or a building without permission (not Australian-specific). Dated; no broad triggers."
- term: troopers
  source: Waltzing Matilda
  guidance: "Mounted police in colonial Australia. Archaic; lookup/explain only."
- term: billabong
  source: Waltzing Matilda
  guidance: "A waterhole, especially a pool left behind in a dry or dead river channel. Current Australian
    English (not slang). Triggers like 'a waterhole', 'an oxbow lake'."
- term: gone walkabout
  source: user
  guidance: "Colloquially, gone missing or wandered off (things or people: 'the remote's gone walkabout'). From
    the Aboriginal walkabout journey; some find the casual use insensitive: note it, keep to the 'gone missing'
    sense, never for the original meaning. User approved adding it."
