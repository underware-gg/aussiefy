    triggers:
      np:
      - a cattle baron
      - cattle barons
  triggers_to_add: {}
  evidence: web
  confidence: high
  why: 'Seed: both senses in the gloss, dated, only the narrow "cattle baron" trigger; modern readers take "squatter"
    as an illegal occupant, hence incoherence 5.'
