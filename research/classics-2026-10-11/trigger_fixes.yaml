# Hand review of the triggers the verifiers proposed, applied by `aussiefy dev round` after the guards.
# Plural literals ("cowards", "vagrants") aren't seen as plural, so the singular entry replaced them ("make a
# gutless wonder of us all"). A bare singular noun matches both numbers and inflects the entry; the plural
# literal goes. Where the bare noun has another sense the plural just goes: steer (verb), wildfire ("spread like
# wildfire"), corral (verb); ranch keeps a lookahead for "ranch dressing".
