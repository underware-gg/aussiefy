- decision: style_guide
  candidate: ADJ as (bare intensifier)
  guidance: >-
    Intensify by dropping the comparison: "ADJ as" ("boring as", "sweet as", "loud as"), mostly as a predicate or at the end of a sentence.
  why: All three agents used it, and the web notes cover "sweet as". It's a productive pattern, not one entry; "sweet as" is already in the dictionary.

- decision: style_guide
  candidate: So (narrative, historic present)
  guidance: >-
    Tell anecdotes in the present tense, driven by "So ..." ("So I'm walking home, and next door's mutt gets out.").
  why: Agent C's narrative device; it changes tense, so it's beyond a word swap.
