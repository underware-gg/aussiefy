- decision: style_guide
  candidate: a bit
  guidance: >-
    Use understatement: soften complaints and praise with "a bit" ("a bit warm" at 45 degrees, "a bit of a pain"),
    deadpan rather than gushing.
  why: Monash research documents the habit, but it's a hedge with no fixed slot. Swapping plain "a little" for it adds nothing Australian.

- decision: merge
  candidate: but (sentence-final)
  into: but
  why: Same particle; the entry is under "but".

- decision: reject
  candidate: good call
  reason: not_aussie
  why: General (originally American sporting) English for "good decision"; nothing Australian about it.

- decision: style_guide
  candidate: I reckon
  guidance: >-
    Hedge opinions with "reckon": "I reckon ...", "Reckon he's jealous", or a trailing ", I reckon." on opinion
    sentences. Don't stack it on a sentence that already has "think" or "reckon".
  why: THINK already maps think to reckon; the free hedge is a habit. It could later be a tag with when [opinion] if the engine checks for an existing think/reckon.

- decision: style_guide
