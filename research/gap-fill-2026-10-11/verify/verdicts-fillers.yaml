# Verdicts for slice-fillers.yaml (gap-fill 2026-10-11), with extra items from web/findings.yaml and the
# agents' `fillers:` lists at the end.
# Placement mechanics come from aussiefy/garnish.py and engine.py:
#   opener      "X, ..." at sentence start (inside the quote for speech)
#   tag         ", X" before sentence-final punctuation; the default `when` is dialogue|question|second_person
#   connective  "X, ..." on narration sentences that don't already open with a connective
#   aside       a short standalone sentence after a sentence (paragraph_end, or after a question)
#   tail        ", X" after a list that ends the sentence (not in speech)
#   closer      once, after the last sentence. NB: the engine passes no contexts to closers, so a closer's
#               `when` is currently ignored. Closers marked when: [opinion] need that check added first.
# Web pages could not be fetched; anything cited as search_summary was judged from the search tool's summary.

# ------------------------------------------------------------------ slice candidates
