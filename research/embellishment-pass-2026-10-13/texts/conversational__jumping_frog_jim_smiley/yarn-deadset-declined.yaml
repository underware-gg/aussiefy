- phrase: a dead-set legend
  reason: 'overstates "a good man" (a parson''s plain decency); deadset adds nothing, so "a good bloke"'
- phrase: young fellas
  reason: 'the boys here are the men of the mining camp, not young lads'
- phrase: dead
  reason: '"dead sick" of a woman near dying reads as dying; the Aussie for sick is "crook"'
- phrase: reckoned
  reason: '"before he thought" means without thinking, not "before he believed"'
- phrase: rapt
  reason: 'rapt means delighted; the mare is agitated and worked up, not pleased'
