decisions:
- id: thatll-do-pig
  file: aussiefy/data/entries/flagged.yaml
  form: that'll do, pig
  concepts_before:
  - AGREE
  frame: interjection
  status_before: omit
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: afi-babe
    locator: Babe (1995), country credits and concluding competition scene
  evidence_scope: exact film quotation and context
  reasoning: The film’s concluding acknowledgement follows the pig’s successful performance. Its praise/completion
    context is not interchangeable with every AGREE trigger. The production is catalogued as Australian/US;
    a story’s apparent farm setting alone cannot decide whether the quotation belongs in Australian repertoire.
  triggers_before:
    AGREE:
      interjection:
      - absolutely
      - definitely
      - of course !=,|;|—|-
      - you bet
      - too right
      - exactly
      - certainly
      - for sure
      - yes, absolutely@4
      - yes, definitely@4
      - you're right
  proposed_action: Keep omitted status pending existing repertoire-policy work. Correct provenance notes;
    if later enabled, use praise/satisfactory-completion contexts rather than generic yes.
  limits: A film quotation’s provenance does not establish everyday Australian idiomatic use. No flag change
    is recommended automatically.
- id: cruisin-for-a-bruisin
