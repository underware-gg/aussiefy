- id: give-two-hoots-about
  file: aussiefy/data/entries/idioms.yaml
  form: give two hoots about
  forms_before:
  - give two hoots about
  concepts_before:
  - CARE_ABOUT
  frame: vp
  status_before: active
  register_before: current
  gloss_before: Care about (usually negated).
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: give-two-hoots-about-ref
    locator: selected headword sense
  evidence_scope: selected headword or idiom meaning
  reasoning: The negative-polarity caring idiom is documented. CARE_ABOUT includes care-less-about, whose
    comparative degree is lost when replaced by the plain caring construction.
  limits: Seed7 reproduces I-could-care-less → I-could-give-two-hoots. Positive uses in questions/conditionals
    are not declared impossible.
  proposed_action: Preserve negation and comparative caring degree; distinguish could-care-less idiomatic
    indifference from literal ability to care less.
  triggers_before:
    CARE_ABOUT: &id001
      vp:
      - care less about
      - give a damn about
      - give a hoot about
  notes_before: Shared English, common in Australia.
- id: give-a-rats-arse-about
  file: aussiefy/data/entries/idioms.yaml
  form: give a rat's arse about
