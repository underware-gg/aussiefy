  - give a rat's arse about
  concepts_before:
  - CARE_ABOUT
  frame: vp
  status_before: active
  register_before: current
  gloss_before: Care about at all (always negated).
  decision: correct_mapping_or_missing_sense
  evidence:
  - source: give-a-rats-arse-about-ref
    locator: selected headword sense
  evidence_scope: selected headword or idiom meaning
  reasoning: The caring expression is documented, usually with negation. The gloss’s always-negated wording
    is too absolute, and the shared comparative trigger needs the same degree/polarity treatment as two-hoots.
  limits: Positive-polarity emphatic, interrogative and conditional constructions can occur. No claim
    that the phrase itself is wrong.
  proposed_action: Soften always to usually/chiefly negative and preserve comparative caring/negation
    in shared CARE_ABOUT detection.
  triggers_before:
