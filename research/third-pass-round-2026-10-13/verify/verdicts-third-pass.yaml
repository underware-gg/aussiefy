# Verdicts for the third-pass round, one per added entry, in the format of the everyday round's verify/BRIEF.md.
# Written by hand from the third pass's findings and harvest: glosses and triggers in our own words, sources are
# open references. DECISIONS.md lists every candidate considered, including the ones skipped or already covered.
# `evidence: own` means own knowledge of a common term, checked against the cited Wiktionary page where there is one.

# --- calling things off, getting on with it --------------------------------------------------------------------
- decision: add_entry
  candidate: pull the pin on (cancel)
  entry:
    id: pull-the-pin-on
    form: pull the pin on {np}
    variants: ['pull the pin on {obj}']
    concept: [NEW:CALL_OFF]
    frame: vp
    intensity: 3
    incoherence: 3
    register: current
    gloss: Call something off, cancel it (they pulled the pin on the trip).
    sources: [https://en.wiktionary.org/wiki/pull_the_pin]
  new_concept:
    id: CALL_OFF
    description: Cancel a planned thing (a trip, a search, a deal), with the thing named after the verb.
    triggers:
      vp: ['call off {np}', 'call {obj} off']
  evidence: own
  confidence: medium
  why: The cancel sense of pull the pin (QUIT keeps the quit sense); only with its object after it, so a passive
    ("the match was called off") isn't caught and the grammar holds.

