# --- reference only --------------------------------------------------------------------------------------------
- decision: add_entry
  candidate: is she buggery
  entry:
    id: is-it-buggery
    form: is it buggery
    variants: [is she buggery, is he buggery]
    concept: [NEW:EMPHATIC_NO]
    frame: interjection
    intensity: 5
    incoherence: 4
    vulgarity: 1
    register: current
    gloss: An emphatic, scornful no to a question, echoing its subject (is he coming? no way).
    sources: [https://en.wiktionary.org/wiki/buggery]
  new_concept:
    id: EMPHATIC_NO
    description: A scornful, emphatic "certainly not" in answer to a question (lookup only); the form echoes the
      question's subject, which no plain trigger can.
    triggers:
      interjection: [most certainly not in any way whatsoever]
  evidence: own
  confidence: medium
  why: Reference only; it echoes the question ("is she...", "did he..."), so no plain "no" can be swapped for it.
