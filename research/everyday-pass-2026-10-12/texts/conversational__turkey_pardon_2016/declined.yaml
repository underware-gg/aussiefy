- phrase: "cactus, stuffed"
  reason: "Wrong sense: 'working on getting him glasses' means trying to, not being ruined or exhausted."
- phrase: "a lucky bugger"
  reason: "Inverts the meaning: the turkeys who 'weren't so lucky' became 'a lucky bugger'."
- phrase: "fuckin' oath"
  reason: "'Of course' here is a transition, not agreement; and the f-word jars in a presidential speech with kids present. Used 'Too bloody right' instead."
- phrase: "little buggers"
  reason: "Too flippant for children gaining health cover; used the riff 'ankle biters, sticky fingers and all' instead."
- phrase: "knocking together"
  reason: "'Knocking together' implies something cobbled up cheaply; wrong for building a diverse society."
- phrase: "every bastard"
  reason: "Wrong tone for a compassionate line about people needing a second chance; used 'every poor bugger'."
- phrase: "battlers"
  reason: "'A hungry people' means the nation at the table, not working-class strugglers; used 'a hungry nation'."
- phrase: "Yep"
  reason: "Breaks the 'Yes, We Can' pun in 'Yes, We Cran'."
