- phrase: bugger all
  reason: "'there won't be nothing to it' means it will be easy, not that there is almost nothing; used 'dead easy'."
- phrase: sweet bugger-all
  reason: "'won't have nothing on you' means won't be better than you; 'sweet bugger-all on you' is not the idiom. Used 'won't be a patch on you'."
- phrase: young fellas
  reason: "'one of the boys' is a teammate, a grown man; used 'one of the blokes'."
- phrase: bloke
  reason: "'the old man' is the club boss, a fixed term; 'the old bloke' makes him just an old man. Kept 'the old man'."
