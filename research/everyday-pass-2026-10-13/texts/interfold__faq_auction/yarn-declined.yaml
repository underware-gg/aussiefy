- phrase: dead set on
  reason: "Wrong sense: '50% of proceeds dedicated to liquidity support' means allocated to, not determined about; and it's a table value kept exact."
- phrase: Nah, nah
  reason: "Register: the FAQ's flat 'No.' answer in official prose; a doubled conversational 'nah, nah' reads as a dismissive aside."
- phrase: Righto
  reason: "Wrong sense: 'Righto' is 'okay then' (agreeing to something), not an answer of yes to 'Was KYC required?'."
- phrase: sweet bugger-all
  reason: "It's in the legal 'No advice / risk notice', kept verbatim; 'Nothing in this communication constitutes...' isn't a slangy 'absolutely nothing'."
