- phrase: stoush
  reason: "Replaces 'war' matched inside \"warn't\" (dialect for wasn't); there is no war in the text."
- phrase: rapt
  reason: "'rapt' means delighted; the mare gets excited in the sense of agitated and desperate, not pleased."
- phrase: young fellas
  reason: "'the boys' here are the grown men of the mining camp, not young lads; used 'the blokes'."
- phrase: reckoned
  reason: "'before he thought' means without stopping to think; 'before he reckoned' loses that sense."
- phrase: a dead-set legend
  reason: "'a good man' is quiet praise of the parson's character; 'a decent bloke' keeps the understatement, 'legend' overpraises."
- phrase: lobbed
  reason: "'anything that turned up' means anything that happened or came up, not someone arriving; 'lobbed' is arrival."
