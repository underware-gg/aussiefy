- phrase: bush
  reason: '"national forest" is a named US land category run by the Forest Service (and the engine also put "bush" for "wilderness", a legal designation); "national bush" is not a thing.'
- phrase: punters
  reason: The "people" are National Park Service employees, not members of the public or customers.
- phrase: Parliament House
  reason: It's the US Congress that hasn't acted on a US federal wilderness designation; localising changes the fact.
- phrase: Nah, nah
  reason: A doubled no reads as brushing off the reader in a factual FAQ answer; used a plain "Nah."
- phrase: Not on your nelly
  reason: '"Absolutely not" is too emphatic and dismissive for a neutral factual answer ("No, Congress hasn''t acted"); used "Nah."'
