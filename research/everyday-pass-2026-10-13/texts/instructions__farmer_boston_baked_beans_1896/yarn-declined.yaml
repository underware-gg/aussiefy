- phrase: too right
  reason: "'of course' here is a parenthetical 'naturally' inside an instruction, not an agreeing reply; 'must, too right, be chucked' is wrong. Used 'naturally'."
- phrase: reckoned
  reason: "'supposed to be cooked' means 'meant to be cooked' (the traditional way), not 'believed'; used 'meant to'."
- phrase: flamin'
  reason: "'very good' became 'bloody good' (a set phrase) rather than 'flamin' beaut'."
