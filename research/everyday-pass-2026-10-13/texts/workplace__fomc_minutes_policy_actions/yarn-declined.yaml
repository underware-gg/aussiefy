- phrase: swear blind
  reason: Wrong part of speech; "resolve" is a noun here ("its continuing resolve"), and "swear blind" is a verb meaning to insist something is true. Used "dead set on" instead.
- phrase: said righto to the following statement
  reason: It sits inside the quoted FOMC statement, which stays verbatim; "righto" is also far too casual for a formal 12-0 vote.
- phrase: give a 1 the nod
  reason: The trigger split the fraction "1/4" and produced "give a 1 the nod/4 percentage point", which garbles the number.
