- phrase: a beaut
  reason: "'ensure a good seal' means an adequate, tight seal; 'a beaut' praises something as excellent, so 'a beaut seal' shifts the sense. Kept 'a good, tight seal'."
- phrase: Give a stuff about
  reason: "Means 'care at all' and lives in the negative ('didn't give a stuff'); 'Pay attention to' here is an instruction to look closely at the flapper's width. Wrong sense and polarity."
- phrase: heaps
  reason: "Replaces 'loads' in '60 loads of dishes', where a load is one dishwasher cycle, not 'lots'. Wrong sense."
