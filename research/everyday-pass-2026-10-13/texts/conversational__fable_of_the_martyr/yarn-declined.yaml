- phrase: Parliament House
  reason: The story is set in America (Uncle Sam, the Alaskan Boundary, the American People), so the windbag means Congress; Parliament House would contradict his own rant.
- phrase: knocked together
  reason: Means built quickly and roughly; Mr Gladden's new house is a mark of his prosperity, not a shoddy job.
- phrase: defo
  reason: Modern youth clipping that jars in a turn-of-the-century fable; used "fair dinkum" for "certainly" instead.
