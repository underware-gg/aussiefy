- decision: add_entry
  candidate: that's yer lot
  entry:
    id: thats-your-lot
    form: that's your lot
    concept: [NEW:THATS_ALL]
    frame: interjection
    intensity: 3
    incoherence: 2
    register: current
    gloss: That's all there is, there's no more (said at the end of a list or a share-out).
    sources: [https://en.wiktionary.org/wiki/that%27s_your_lot]
  new_concept:
    id: THATS_ALL
    description: Saying there is nothing more, at the end of a list or a share-out.
    triggers:
      interjection: [that's all, that is all, that's all there is]
  evidence: own
  confidence: medium
  why: As an interjection it fires only on a clause of its own ("That's all."), not "that's all I know". Shared
    with British English; the everyday Australian close (the drawl gives "yer lot").

