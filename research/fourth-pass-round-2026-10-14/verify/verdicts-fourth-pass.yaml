# --- judgement and certainty ----------------------------------------------------------------------------------
- decision: add_entry
  candidate: sure as eggs
  entry:
    id: sure-as-eggs
    form: sure as eggs
    concept: [NEW:SURE_AS_CAN_BE]
    frame: adv
    intensity: 3
    incoherence: 3
    register: current
    gloss: As sure as can be, without a doubt (sure as eggs, he'll be late).
    sources: [https://en.wiktionary.org/wiki/sure_as_eggs]
  new_concept:
    id: SURE_AS_CAN_BE
    description: Certainly, without a doubt, as a sentence adverb ("as sure as can be, he was late").
    triggers:
      adv: [as sure as can be, sure as can be, as sure as anything, sure as anything]
  evidence: own
  confidence: medium
  why: Not "definitely" or "certainly" (inside a verb phrase "sure as eggs" breaks the grammar, "it will sure as
    eggs rain"); only the sentence adverbs it replaces word for word.

