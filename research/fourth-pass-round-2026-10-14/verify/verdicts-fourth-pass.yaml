# Verdicts for the fourth-pass round, one per added entry, in the format of the everyday round's verify/BRIEF.md.
# Written by hand from the fourth pass's findings and the yarn agents' notes: glosses and triggers in our own words,
# sources are open references. DECISIONS.md lists every candidate considered, including the ones skipped or already
# covered, and the hand edits (cop, the oldies, a fair whack, crook, the dialect table).
# `evidence: own` means own knowledge of a common term, checked against the cited Wiktionary page where there is one
# (a HEAD request with the User-Agent aussiefy-research/0.1; nothing was taken from the pages).

# --- talk and calling out ----------------------------------------------------------------------------------------
- decision: add_entry
  candidate: give us a hoy
  entry:
    id: give-a-hoy
    form: give {obj} a hoy
    concept: [CALL_OUT]
    frame: vp
    intensity: 3
    incoherence: 3
    register: current
    gloss: Call out to someone, or get in touch (when you're back, say).
    sources: [https://en.wiktionary.org/wiki/hoy]
  evidence: own
  confidence: medium
  why: CALL_OUT's "give {obj} a shout" carries its person, so the form fits; its bare "holler" and "yell out" have
    no object, and the form refuses them. Not "a shout" alone (a round of drinks).

