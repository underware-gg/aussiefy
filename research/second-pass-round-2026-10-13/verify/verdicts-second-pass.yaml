# --- easy as, done and dusted, het up, knocked for six ---------------------------------------------------------
- decision: add_entry
  candidate: easy as
  entry:
    id: easy-as
    form: easy as
    concept: [NEW:DEAD_EASY]
    frame: predicate_adj
    intensity: 4
    incoherence: 2
    register: current
    gloss: Very easy; the comparison ("easy as pie") left off, which is the point.
  new_concept:
    id: DEAD_EASY
    description: Very easy, no trouble at all (as a predicate, with nothing after it).
    triggers:
      predicate_adj: ["very easy !=to|for", "really easy !=to|for", "easy as pie",
                      "a piece of cake"]
  evidence: own
  confidence: high
  why: The truncated simile can't take a complement, so "very easy to use" and "easy for you" are blocked.

