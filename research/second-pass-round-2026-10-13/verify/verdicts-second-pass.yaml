- decision: add_entry
  candidate: a fair bit
  entry:
    id: a-fair-bit
    form: a fair bit
    concept: [NEW:QUITE_A_LOT]
    frame: np
    intensity: 2
    incoherence: 1
    register: current
    plural: a fair bit
    gloss: Quite a lot, a sizeable amount (it took a fair bit of doing).
    sources: [https://en.wiktionary.org/wiki/a_fair_bit]
