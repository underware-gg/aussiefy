# Verdicts for the second-pass round, one per added entry, in the format of the everyday round's verify/BRIEF.md.
# Written by hand from the second pass's findings and harvest: glosses and triggers in our own words, sources are
# open references. DECISIONS.md lists every candidate considered, including the ones skipped or already covered.
# `evidence: own` means own knowledge of a common term, checked against the cited Wiktionary page.

# --- keen ------------------------------------------------------------------------------------------------------
- decision: add_entry
  candidate: keen
  entry:
    id: keen
    form: keen
    concept: [NEW:EAGER]
    frame: predicate_adj
    intensity: 3
    incoherence: 1
    register: current
    gloss: Eager, up for it; with "to" (keen to help) or "for" (keen for a swim), or alone (you keen?).
    sources: [https://en.wiktionary.org/wiki/keen]
  new_concept:
    id: EAGER
    description: Eager to do or have something (of a person); "keen" is the everyday Australian word.
    triggers:
      predicate_adj: [eager ^person]
  evidence: own
  confidence: high
  why: The predicate only, so "her eager eyes" and "an eager student" keep their adjective.

- decision: add_entry
  candidate: keen as mustard
  entry:
    id: keen-as-mustard
    form: keen as mustard
    concept: [NEW:VERY_EAGER]
    frame: predicate_adj
    intensity: 5
    incoherence: 3
    register: current
    gloss: Very eager indeed, raring to go.
    sources: [https://en.wiktionary.org/wiki/keen_as_mustard]
  new_concept:
    id: VERY_EAGER
    description: Very eager, raring to go (of a person). Apart from EAGER, so a plain "eager" isn't overstated.
    triggers:
      predicate_adj: ["very eager ^person", "really eager ^person", "extremely eager ^person",
                      "raring to go ^person"]
  evidence: own
  confidence: high
  why: Shared with British English but a stock Aussie simile; its own concept, so only strong eagerness takes it.

- decision: add_entry
  candidate: keen on
  entry:
    id: keen-on
    form: keen on
    concept: [NEW:KEEN_ON]
    frame: predicate_adj
    intensity: 3
    incoherence: 1
    register: current
    gloss: Enthusiastic about something, into it (keen on footy, not keen on the idea).
    sources: [https://en.wiktionary.org/wiki/keen]
  new_concept:
    id: KEEN_ON
    description: Enthusiastic about a thing or an idea, into it. Not "fond of", which can be said of a person
      with no romance in it (and "keen on her" has some).
    triggers:
      predicate_adj: [enthusiastic about]
  evidence: own
  confidence: high
  why: Not "fond of" (keen on a person is romantic) or "care for" (to look after someone).

# --- meant to, the odd, a fair bit -----------------------------------------------------------------------------
- decision: add_entry
  candidate: meant to
  entry:
    id: meant-to
    form: meant to
    concept: [NEW:SUPPOSED_TO]
    frame: predicate_adj
    intensity: 3
    incoherence: 1
    register: current
    gloss: Supposed to, expected to (you're meant to wait here; it's meant to rain); also reputed to.
    sources: [https://en.wiktionary.org/wiki/meant_to]
  new_concept:
    id: SUPPOSED_TO
    description: Supposed to, expected or obliged to ("you're supposed to wait"), or reputed to.
    triggers:
      predicate_adj: [supposed to]
  evidence: own
  confidence: high
  why: The Aussie default for "supposed to" in every one of its senses; "supposed" without "to" isn't caught.

- decision: add_entry
  candidate: the odd
  entry:
    id: the-odd
    form: the odd
    concept: [NEW:OCCASIONAL]
    frame: adj
    intensity: 2
    incoherence: 1
    register: current
    gloss: An occasional one here and there (the odd shower, the odd beer).
    sources: [https://en.wiktionary.org/wiki/odd]
  new_concept:
