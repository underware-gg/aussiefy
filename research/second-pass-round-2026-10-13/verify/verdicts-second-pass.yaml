- decision: add_entry
  candidate: wouldn't it (rot your socks)
  entry:
    id: wouldnt-it-rot-your-socks
    form: wouldn't it rot your socks
    variants: [wouldn't it]
    concept: [NEW:EXASPERATION]
    frame: interjection
    intensity: 4
    incoherence: 5
    register: dated
    gloss: An exclamation of exasperation at bad luck or a raw deal (wouldn't it!).
  new_concept:
    id: EXASPERATION
    description: Exasperation at bad luck (lookup only). "Can you beat that" is also a challenge to beat a record.
    triggers:
      interjection: [well wouldn't that just rot your socks off]
  evidence: own
  confidence: medium
