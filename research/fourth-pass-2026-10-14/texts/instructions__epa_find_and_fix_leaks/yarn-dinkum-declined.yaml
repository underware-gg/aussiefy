- phrase: Give a stuff about
  reason: "Only used in the negative ('didn't give a stuff'), and as an order to the reader it reads as rude; 'keep an eye on' says 'pay attention to'."
- phrase: rocks up
  reason: "Means a person arriving casually; food colouring appearing in the bowl takes the wrong sense."
- phrase: heaps
  reason: "'60 loads of dishes' is a count of dishwasher loads, not 'lots'; '60 heaps' changes the meaning."
