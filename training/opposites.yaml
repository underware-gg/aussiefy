# Concepts with opposite meanings, for training only: scripts/train_embedder.py turns each pair into negatives
# (A's triggers and glosses pushed away from B's forms, and B's from A's), so "a heap of money" stops landing
# on *stony broke*. Static vectors put words that share a topic close together, opposite or not.
#
# List only true opposites, both concepts in concepts.yaml. Near misses (LUCKY / STRUGGLE, BRAND_NEW / BROKEN)
# are left out: pushing apart things that are merely different costs recall for nothing.

- [RICH, BROKE]
- [HOT_WEATHER, FREEZING]
- [SCORCHING, FREEZING]
- [HAPPY, SAD]
- [HAPPY, DISAPPOINTED]
- [CONTENT, FED_UP]
