# Reviewed grammatical forms preserve activity and meal-time distinctions.
- id: have-a-goss
  form: have a goss
  concept:
  - GOSSIP
  frame: vp
  incoherence: 3
  gloss: Have a gossip session; a verb form, separate from the information noun.
  sources:
  - https://www.collinsdictionary.com/dictionary/english/goss
  - https://www.macquariedictionary.com.au/heard-it-on-the-bush-telegraph/
  notes: A compatible grammatical form of the existing goss vocabulary. The sources attest the clipped noun,
    not every whole construction.
