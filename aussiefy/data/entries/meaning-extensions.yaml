# Reviewed sense and vocabulary additions; source prose is not reproduced.
- id: tell-them-theyre-dreamin
  form: tell them they're dreamin'
  concept: [TELL_THEM_DREAMING]
  frame: interjection
  incoherence: 3
  gloss: Tell them their expectation or asking price is unrealistic.
  notes: A referent-preserving adaptation of the familiar Castle catchphrase.
  sources: [https://www.abc.net.au/listen/programs/worldtoday/trading-post-published-for-last-time/1122154]
- id: could-do-with-a-feed
  form: could do with a feed
  concept: [WELCOME_MEAL]
  frame: vp
  class: phrase
  incoherence: 2
  gloss: Would welcome a meal; an understated expression of appetite.
  notes: Sources attest feed for a meal. Fixed conditional wording replaces the corresponding conditional food request; other tense and question shapes stay plain.
  sources: [https://www.oxfordlearnersdictionaries.com/definition/english/feed_2]
- id: wouldnt-say-no-to-some-tucker
  form: wouldn't say no to some tucker
  concept: [WELCOME_FOOD]
  frame: vp
  class: phrase
  incoherence: 2
  gloss: Would be willing to have some food.
  notes: Composed appetite wording; sources attest tucker for food rather than every word of this construction.
  sources: [https://www.collinsdictionary.com/us/dictionary/english/tucker]
- id: goon-of-fortune
  form: Goon of Fortune
  concept: [GOON_OF_FORTUNE]
  frame: np
  incoherence: 3
  gloss: A drinking game with a wine bag attached to a rotary clothesline; the spin selects who drinks.
  notes: Cask wine, a goon bag and a Hills Hoist are distinct related concepts. This names the specific game rather than replacing a generic party or drinking game.
  sources: [https://www.abc.net.au/news/2016-08-23/australian-national-dictionary-thousands-of-words-added/7776480]
- id: hills-hoist
  form: Hills Hoist
  concept: [HILLS_HOIST]
  frame: np
  plural: Hills Hoists
  incoherence: 2
  gloss: The familiar Australian brand of rotary clothesline, raised or lowered with a winding mechanism.
  notes: A named cultural reference. A generic clothesline is not automatically assigned this brand.
  sources: [https://collection.powerhouse.com.au/object/166945]
