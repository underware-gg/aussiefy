- id: hills-hoist
  form: Hills Hoist
  concept: [HILLS_HOIST]
  frame: np
  plural: Hills Hoists
  incoherence: 2
  gloss: The familiar Australian brand of rotary clothesline, raised or lowered with a winding mechanism.
  notes: A named cultural reference. A generic clothesline is not automatically assigned this brand.
  sources:
  - url: https://collection.powerhouse.com.au/object/166945
    kind: media
    publisher: collection.powerhouse.com.au
    supports: [term, meaning, australian_use]
    note: 'Reviewed 2026-10-21: selected form/sense; 16–17;32. Powerhouse describes Australian Hills Hoist scale replica
      with rotary wire lines and raising/lowering mechanism accurately matching full product. Toy dates not first-use
      dates of term. Source family: powerhouse-museum; not a current-commonness survey.'

