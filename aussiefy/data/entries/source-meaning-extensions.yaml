- id: you-mob
  form: you mob
  concept: [YOU_PLURAL, PLURAL_ADDRESS]
  frame: np
  intensity: 3
  incoherence: 2
  gloss: The people being spoken to, as a group.
  notes: A plural second-person form, especially characteristic of Aboriginal English and northern Australian speech. Not a distributive subject such as everyone is ready.
  sources:
