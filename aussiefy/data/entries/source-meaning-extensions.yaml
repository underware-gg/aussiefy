- id: couldnt-give-a-stuff-about
  form: couldn't give a stuff about
  concept:
  - INDIFFERENCE_MODAL
  frame: vp
  intensity: 3
  incoherence: 2
  gloss: Could not care less about something; the negative modal is part of the meaning.
  sources:
  - https://www.oxfordlearnersdictionaries.com/us/definition/english/stuff_1
  notes: A grammatical negative-modal form of the attested not-give-a-stuff idiom; retains could-not-care-less polarity.
