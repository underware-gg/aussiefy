# Plain-word swearing: the everyday swaps Australians make with a swear (very -> fuckin', nothing -> fuck all,
# go away -> fuck off, an idiot -> a dickhead). Each entry's level is how hard it is to follow, not how vulgar it
# is: that is the vulgarity dial's business (vulgarity 1 dad, 2 uncle-bob, 3 tradie). Drawn from three
# unharnessed "swearing like a dockie" retellings of the reference texts (2026-10-12), checked by hand; terms
# the retellings marked doubtful or not distinctively Australian ("holy shit", "Jesus Christ") are left out.

# --- intensifiers -------------------------------------------------------------------------------------------
- id: fuckin-very
  form: fuckin'
  concept: [VERY]
  frame: adv
  intensity: 5
  vulgarity: 2
  incoherence: 1
  weight: 0.6
  gloss: The f-word as an all-purpose intensifier ("fuckin' freezing").
  sources: [https://en.wiktionary.org/wiki/fucking]

