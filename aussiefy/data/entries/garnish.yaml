# Garnish attaches to text rather than replacing it.
#   opener: sentence start ("Strewth, ...")
#   tag:    before sentence-final punctuation ("..., mate.")
#   closer: once, after the last sentence ("Faaaark me.")
# stretch: true elongates the first vowel at levels with a stretch range.

