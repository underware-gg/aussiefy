# Riffs: the image an Aussie term brings to mind, beyond what it means.
#
# A wheelie bin means a rubbish bin, but to an Australian it calls up the bin chickens raiding it. That
# association is what makes "Wheelie bins overflowin', bin chickens fightin' over the scraps!" land, and
# it isn't translation: it's colour that hangs off a word already in the text.
#
# Keyed by entry id. Each riff is written to follow its term after a comma ("wheelie bins, <riff>"), and
# works for one or many. Each has a tone: comic (a laugh), grim (bleak) or plain (just a picture). The
# text's mood pulls the choice like gravity, not a fence: in a solemn text (Gettysburg) a comic riff is a
# quarter as likely, likewise a grim one in a light text, and plan marks which riffs suit the mood.
# lookup and plan offer them as optional colour; at level 5 the engine may attach one where the term ends
# a clause (profiles.yaml `riff`). Swearing in a riff is rated from swears.yaml,
# so riffs over the vulgarity cap are never offered.

wheelie-bin:
  - {text: "overflowin', bin chickens fightin' over the scraps", tone: comic}
  - {text: "tipped over in the gutter", tone: plain}
  - {text: "rottin' in the heat", tone: grim}
bin-chicken:
  - {text: "headfirst in a wheelie bin", tone: comic}
  - {text: "nickin' chips off some poor bugger's plate", tone: comic}
footpath:
  - {text: "cracked to buggery", tone: plain}
  - {text: "hot enough to fry an egg on", tone: comic}
the-pollies:
