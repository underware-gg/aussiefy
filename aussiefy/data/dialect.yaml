# Words American or British English uses where Australians say something else. The engine swaps them at
# every level, like spelling: this is plain Australian English, not slang (the dictionary does the slang,
# and wins where it swaps the same words). lint flags them in a draft.
#
# Each section maps a pattern to the Australian. The pattern is a trigger pattern (aussiefy/matcher.py): a
# noun phrase whose last word also matches its plural, "!a|b" blocks a sense by the next words, and a
# pattern with `frame: vp` is a verb phrase whose first word inflects ("stood in line" -> "queued up").
# The value is the Australian, or a mapping:
#   to:          the Australian
#   frame:       vp for a verb phrase (np by default)
#   plural:      its plural, when it isn't regular (or the Australian is already plural: candy -> lollies)
#   known_only:  the word is ordinary in Australia in another sense (British pants are undies, Australian
#                pants are trousers), so it swaps only once the text is known to be in that English: the
#                `english` dial, or for American, its spelling (color, gray)
#   not_in:      genres where the word is a term of art (a browser's cookies)
#
# A swap to itself is a guard: it claims its words so a shorter swap inside can't ("petroleum jelly" keeps
# its jelly). Overlapping swaps go longest first. The table is checked at load: no Australian it writes may be
# swapped again by another entry.
#
# `both` holds what American and British English share and Australia doesn't. `lint_only` is for lint: words
# with no plain swap ("y'all" -> youse is slang).

both:
  flip-flop !on|again|back: {to: thong, plural: thongs}   # not "flip-flops on taxes"
  flip flop !on|again|back: {to: thong, plural: thongs}
  duvet: doona
  butternut squash: butternut pumpkin
  bicarbonate of soda: bicarb soda
  real estate agent: real estate agent

