craft:
- rules: "- Use slang Australians actually say. It needn't be exclusively Australian, but nothing American and\n\
    \  nothing invented. If you're unsure, look it up; if it's not there and you're not sure, don't use it.\n- Translate\
    \ meanings, not words. Each idiom brings its own grammar (\"he's extremely busy\" becomes\n  \"he's flat out\
    \ like a lizard drinking\"; \"believing it impossible\" becomes \"reckoning it had Buckley's\").\n- Keep every\
    \ fact, name and claim. Keep the original's structure and its famous lines where they still\n  work (\"of the\
    \ people, by the people, for the people\"). Translate the register, not the content.\n- One opener or tag-on\
    \ per sentence at most, and not on every sentence.\n- Localise where it helps the listener (Congress becomes\
    \ Parliament House, a sidewalk a footpath, an ibis\n  a bin chicken) and reach for body slang and similes (noggin,\
    \ ticker, deaf as a post).\n- Where the setting takes tag-ons (not deadset), they go where someone is being\
    \ spoken to: dialogue,\n  questions, \"you\". In a story's narration, move it along with connectives instead\
    \ (\"Anyway,\", \"Well,\",\n  \"Now,\", \"So\"). In a monologue or poem the speaker is talking to the listener,\
    \ so \"mate\" aimed at them is\n  fine a few times in the whole piece.\n- At levels 4-5 people talk broader\
    \ than narrators: dialogue gets the heaviest drawl (\"me porridge\", \"Oi!\").\n- Don't pile up synonyms (\"\
    knackered, stuffed, done in\") and don't reuse the same slang. Vary it. The\n  exception is a deliberate pattern\
    \ in the original, like the three bears' lines: keep each speaker's\n  phrasing consistent if the story's rhythm\
    \ depends on it.\n- Australian spelling: honoured, colour, organise, grey, mum.\nHow Australians talk, beyond\
    \ the words (use a few, not all):\n- Understate: soften praise and complaint with \"a bit\" and \"a bit of a\"\
    \ (\"a bit warm\" at 45 degrees, \"a\n  bit of a worry\", \"a bit of a character\"). Deadpan beats gushing.\n\
    - Hedge an opinion with \"reckon\": \"I reckon ...\", \"Reckon he's jealous\", or a trailing \", I reckon.\"\
    \ Don't\n  stack it on a sentence that already says \"think\". Shrug with \"I s'pose\" and \"dunno\".\n- Leave\
    \ details vague at the end: \"or something\", \"or whatever\", \"and that\", \"and stuff\".\n- Clip \"as ADJ\
    \ as anything\" to \"ADJ as\" at the end of a clause (lazy as, keen as, boring as); once a\n  paragraph at most,\
    \ and never on an adjective that already has an Aussie form.\n- Drop \"to\" before familiar places: \"down the\
    \ beach\", \"up the shops\", \"over the road\", \"round Dave's\".\n- Soften a request with \"will ya?\" (\"\
    Pass us the tongs, will ya?\"), on imperatives only; check with an echo\n  tag in casual form (\"haven't ya?\"\
    , \"isn't he?\").\n- In a yarn, report speech with \"goes\" in the present (\"and he goes, 'Mate, ...'\"). \"\
    Yeah, nah\" means no;\n  \"nah, yeah\" means yes.\n- Vary how a piece opens. \"Right, so\" is the opener every\
    \ model reaches for: the plan's openings (OPENINGS in\n  yarn mode) suggest a few for this text, or start straight\
    \ in with the action.\n- \"but\" at the very end of a sentence (\"It was good, but.\") means \"though\"; only\
    \ after a contrast.\nFrom the classic bush yarns :\n- Tag the subject back on for emphasis: \"He's a good bloke,\
    \ is Davo\", \"Never get done, do they.\"\n- \"fair\" before a verb means \"really, completely\" (\"it fair\
    \ knocked me flat\"), and \"a fair\" measures (\"a fair\n  way\", \"a fair bit\"). Not before an adjective.\n\
    - Bring someone on with \"and who does she run into but ...\" / \"who should turn up but ...\".\n- Undercut\
    \ rather than gush: end praise with a flat clause that takes some back, and let a narrator run\n  themselves\
    \ down (\"like any mug would\") instead of boasting.\n- Old bush grammar (\"I seen\", \"them blokes what keeps\"\
    ) is for a character's speech, rarely. Never Cockney\n  eye-dialect (wiv, orf, 'ere, lorst): it reads British,\
    \ not Australian.\n- Everyday Australian choices: \"cos\" for because (not \"'cause\" or \"cuz\"), \"meant to\"\
    \ over \"supposed to\",\n  \"mightn't\", \"keen on\" for wanting or liking, \"the odd\" for the occasional (\"\
    the odd shower\"), and \"goes\"\n  to bring in speech in a yarn (\"and he goes, 'Crikey!'\").\n- In dialogue\
    \ and yarns at higher levels, \"me\" for \"my\" and \"meself\" (\"all up meself\") are fine; never in\n  instructions\
    \ or formal text."
- heading: 'Troppo: perform it; don''t transcribe it:'
  rules: "- A bloke performing it at the pub, not translating it: the talker's connectives, reactions and punchlines.\n\
    - Every line should sound like it's being said at the bar. A line left in its original wording because\n  it\
    \ sounds poetic or formal is a miss. The engine's draft is a floor, not a ceiling.\n- Unpack an abstract image\
    \ into a concrete, physical, local one: \"a thousand blind windows\" becomes \"a\n  thousand windows and not\
    \ one of 'em can see a thing\"; \"the stunned governments\" becomes \"the pollies\n  standin' about like stunned\
    \ mullets\"; \"ate up their brains\" becomes \"scoffed the lot\".\n- React like a talker. After a big question,\
    \ a rhetorical follow-up (\"What sort of galah does that,\n  ay?\"). At the end of a stanza or a beat, a short\
    \ punchline about this story, in its own terms: the\n  pigs' wolf gets \"Serves the big bad so-and-so right\"\
    , a vain emperor \"Talk about up himself\". A stock\n  exclamation that would end any story is the weak choice,\
    \ and don't reuse one across pieces.\n  Round off a list (\"the whole box and dice\"). Give a villain or an\
    \ abstraction a personality (\"Moloch,\n  a real piece of work\"). Each of these a few times in a piece, not\
    \ on every line.\n- Let a term call up its image: lookup and plan list riffs, the pictures an Aussie sees when\
    \ they hear a\n  word (\"wheelie bins overflowin', bin chickens fightin' over the scraps\"). One or two in a\
    \ piece is gold;\n  one on every line is a stand-up routine.\n- Elaborating something that's in the original\
    \ is colour; new events, characters or scenes are not. Every\n  addition hangs off something already there (lint\
    \ checks the length against the embellishment's limit).\n- At level 5 a yarn can be told in the present tense\
    \ (\"she's traipsin' along when she comes across...\") and\n  use short beats (\"Nothin'. Not a bloody peep.\"\
    ), as long as nothing in the story changes."
  requires_performance: true
- rules: "- Swear inside the sentence, not at its edges: \"a bloody great stoush\", \"can't bloody well\", \"too\
    \ bloody\n  hot\". Swearing is seasoning: no single swear more than about once per 80 words, and vary them (bloody,\n\
    \  flamin', bloody well, bugger)."
  min_vulgarity: 1
  requires_infix: true
workflow:
- 'Know the brief: the level, and how rude it can be (by default, the level''s own).'
- 'Read the guide for the level ({guide}): its voice, language limits and craft rules.'
- 'Get the plan ({plan}): the engine''s draft, the phrases it planned and the sentences it couldn''t carry.'
- Write your own version, keeping every event, fact and character and the planned phrases that fit. Look up ({lookup})
  anything you're unsure is genuinely Australian, or a meaning you want options for.
- Lint it ({lint}, with the original) and fix every issue.
- Deliver it.
plan_note: 'Planned phrases are vetted candidates, not obligations: drop pile-ups, anything that doesn''t flow and
  any the engine took in the wrong sense ("battlers" for "one people"). Difficult and untouched sentences are where
  your own writing adds most. Riffs are images an Aussie term calls up (wheelie bins -> bin chickens fightin'' over
  the scraps): use one or two where they land, not all of them; the one marked `best` is the term''s signature image.
  Lean towards riffs that suit the text''s `mood` (suits_mood), but it''s a lean, not a rule: a riff that fits the
  line and flows can cut against the mood, and a dark text can take a laugh. Openings suggest ways to start this
  text other than the "Right, so" every model reaches for.'
yarn_rules: "- Keep every event, fact, number, name, instruction and claim. Don't add plot, characters or scenes.\
  \ Add a\n  talker's colour only as far as EMBELLISHMENT allows (and the style guide says how).\n- If OPENINGS are\
  \ offered, open the way a talker would (not with \"Right, so\"); if none are, start with the\n  text.\n- DIFFICULT_SENTENCES\
  \ are the ones the engine couldn't carry, where your writing adds most; a word in them the\n  GENRE says to keep\
  \ (a term of art, a legal or scientific term) stays as it is.\n- In plain text a heading keeps its place and its\
  \ shortness, and its words may be Aussified like any others; in\n  a Markdown or MDX document (MARKUP) headings\
  \ stay exactly as they are. A US unit may carry the metric in\n  brackets (\"90°F (32°C)\"), never replace it.\n\
  - Use lookup whenever you're unsure a phrase is genuinely Australian or what it means.\n- Run lint on your draft\
  \ and fix every issue it reports.\n- The engine sometimes takes the wrong sense or part of speech (compare a phrase's\
  \ `replaces` and `means`):\n  \"battlers\" for any \"people\", \"tucker\" in \"food colouring\", \"reckon\" for\
  \ the noun \"figure\". Leave a wrong one\n  out and list it in submit's `declined` with a one-line reason. Never\
  \ work a phrase in somewhere else just\n  to keep it.\n- Finish by calling submit with the complete text. If it's\
  \ rejected, fix what it says and submit again."
