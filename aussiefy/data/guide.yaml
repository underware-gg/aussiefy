levels:
  1: Plain English with the odd everyday Aussie word (arvo, brekkie, mate). Nobody should notice.
  2: 'Light Aussie: everyday slang words and short phrases (no worries, too easy, a squiz). Still clean.'
  3: 'Colourful Aussie: idioms where they fit naturally (flat out like a lizard drinking), easy to follow.'
  4: 'Broad Aussie: plenty of slang and idiom, casual contractions.'
  5: 'Full Aussie: as much slang and idiom as the text will bear, every word that has an everyday Aussie one, and
    the drawl (goin'', ya, yer, ''n). How much colour beyond the words is the embellishment''s call.'
language:
  0: 'Clean: no swearing.'
  1: 'Mild everyday profanity only: bloody, bugger, bastard, donger.'
  2: 'Common but impolite language is fine: piss, arse, balls, fuck. Not the c-word.'
  3: 'Anything Australians say, including the c-word, used the Australian way: rude but often affectionate ("a good
    cunt"), never as an American slur.'
