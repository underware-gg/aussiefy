    np: ["equal opportunity", "fairness", "fair treatment", "a fair chance"]
REASONABLE:
  description: Proper, fitting, reasonable.
  triggers:
    predicate_adj: ["fitting and proper", "proper", "appropriate", "reasonable", "only right", "only fair",
                    "fitting"]
FATHER:
  description: Father.
  # a report's father (an obituary's "the son of a Methodist preacher") isn't the old man or the old fella, which
  # are fond but irreverent (dinkum-check round)
  not_in: [news, official, technical]
  triggers:
    np: ["father", "dad"]
POLITICIAN:
  description: A politician.
  # "the government" in a notice or a policy is the agency and its staff (scammers pretending to be from the
  # government), not the pollies
  not_in: [official, technical, instructions]
  triggers:
    np: ["politician", "statesman", "senator", "congressman", "member of parliament", "lawmaker",
         "political representative", "elected politician"]

# --- the words that stuck out in Gettysburg, plus everyday filler -------------
SANCTIFY:
  description: Make sacred. Only loose paraphrases are available, with explicit dubious_meaning unlock.
  triggers:
    vp: ["consecrate {obj}@4", "hallow {obj}@4", "sanctify {obj}@4", "consecrate@4", "hallow@4", "sanctify@4",
         "dedicate", "make sacred", "bless"]
FIRST_USE:
  description: Use an object for the first time, rather than consecrating or naming it.
  triggers:
    vp: ["use {np} for the first time"]
DEDICATED_TO:
  description: >-
    Guard (no entries) - "dedicated to" is devoted or allocated to ("a nation dedicated to the proposition",
    "proceeds dedicated to liquidity"), not consecrated or set on.
  triggers:
    np: ["dedicated to", "dedicated here to", "dedicated there to", "here dedicated to"]
COMMITTED:
  description: Set on having or doing something, determined on it.
  triggers:
    # an adverbial chunk so it works after "be" and in participle clauses ("..., and bent on revenge"). Only the
    # phrasings "dead set on" can stand in for word for word, with "on" and a noun or -ing after: not "dedicated
    # to" (half the proceeds were dedicated to liquidity: allocated), "devoted to" (his wife, a chapter devoted
    # to birds), "committed to" (prison, memory) or "determined to" ("dead set on win")
    adv: ["intent on", "hell-bent on", "hellbent on", "bent on !=one|both|all|his|her|their", "determined on"]
DEVOTION:
  description: Loyal devotion to a cause or to each other.
  triggers:
    np: ["devotion", "loyalty", "solidarity", "fellowship"]
COMRADESHIP:
  description: Fellowship and solidarity between companions or peers.
  triggers:
    np: ["comradeship", "camaraderie", "solidarity between friends", "fellowship between friends"]
RESOLVE:
  description: Insist with total conviction that something is true ("I'd swear it was him").
  triggers:
    # not "resolve" (a noun, "continuing resolve", or sort out, "resolve the issues"), "vow" (swear blind takes no
    # "to": "vowed to return") or a bare "swear" (curse at someone)
    vp: ["swear up and down", "swear that", "solemnly swear that", "swear on {poss} life that"]
NATION:
  description: A nation or people as a community.
  triggers:
    np: ["tribe"]   # not "nation" or "community": "across the mob", "the Kurdish mob"
HEREABOUTS:
  description: This part of the world.
  triggers:
    np: ["this continent", "this region", "these parts", "this area", "this part of the world"]
    adv: ["on|in this continent", "in this region", "in these parts", "around here", "in this part of the world"]
FOUND:
  description: Bring into being; establish.
  triggers:
    vp: ["bring forth", "bring into being", "put together",   # not bare "build": "build a house" isn't "kick off"
         "throw together"]
THINK:
  description: Think, believe, suppose.
  triggers:
    vp: ["think !about|of|over|through|up|back|ahead|twice|again", "believe !in|me|you|it",
         "suppose !to"]   # not "figure" (a noun as often) or "expect" ("thunderstorms are expected")
AFFIRM:
  description: A plain yes.
  triggers:
    interjection: ["yes", "yes please", "sure"]
OK_THEN:
  description: All right, okay, agreeing to go ahead (not a yes to a question of fact).
  triggers:
    interjection: ["okay", "ok", "alright", "all right", "okay then", "all right then", "very well"]
SPOOKED:
  description: Startled or rattled (by something), not afraid of it.
  person: true
  triggers:
    predicate_adj: ["spooked", "startled", "rattled", "unnerved", "jumpy", "on edge"]
DENY:
  description: A plain no.
  triggers:
    interjection: ["no", "no thanks", "nope"]
CONSPICUOUS:
  description: Be glaringly obvious or out of place.
  triggers:
    # not a thing that projects ("a nail sticks out of the board", "stick out your tongue")
    vp: ["stick out !=of|from|over|above|beyond|through|your|his|her|their|my|our|its|the|a", "stand out",
         "look out of place", "stick out a mile"]
    predicate_adj: ["obvious", "glaringly obvious@4", "out of place", "conspicuous"]
DOUBT_IT:
  description: Doubt that a proposal is feasible, without ruling it out.
  triggers:
    vp:
    - doubt {np} could be done@3
    - doubt {np} would work@3
IMPOSSIBLE:
  description: Something can't happen or be done.
  triggers:
    clause: ["it|that|this {be} simply|quite|completely|totally|utterly|just? impossible@4",
             "it|that|this {be} not possible@3", "it|that|this {be} out of the question@4",
             "it|that|this {be} never going to happen@4", "it|that|this {be} not going to happen@3",
             "{be} it|that|this simply|really|actually|just? impossible@4"]
GO_ALONG:
  description: Agree to a proposal.
  # a committee's or a board's "approved" is a formal act (a vote), not reckoning it a goer
  not_in: [official, technical, news]
  triggers:
    vp: ["assent to {np}", "consent to {np}", "go along with {np}", "approve {np}"]   # "agree to" takes verbs

# --- concepts introduced by the fragment pass ------------------------------------
EGG:
  description: An egg.
  triggers:
    np: [egg]
DOLLAR:
  description: A dollar; money loosely.
  triggers:
    # "the buck stops here" is responsibility (a guard ending on the verb would be read as a verb, so it is held here)
    np: ["dollar !bill|bills|note|notes|sign|signs|store|stores|amount|amounts|value|coin|coins", "buck !=stops|stopped|stop|up"]
MONEY_IDIOM_OTHER_SENSE:
  description: >-
    Guard (no entries) - "pass the buck" is about responsibility (and "the buck stops here", held on DOLLAR's own
    trigger), "buck the trend" is a verb, and cents on the dollar or what a dollar is worth is an exact sum: none
    is money in slang.
  triggers:
    # the verbs as verb phrases: a noun-phrase guard right after a pronoun ("they pass the buck") is refused
    vp: ["pass the buck", "buck the trend"]
    np: ["bang for {poss} buck", "bang for the buck", "cents on the dollar", "cents on any dollar",
         "cents in the dollar", "cents to the dollar", "a dollar is worth", "the dollar is worth",
         "dollar is worth", "dollars are worth", "the US dollar", "the U.S. dollar", "the Australian dollar"]
SAVELOY:
  description: A saveloy / frankfurt sausage.
  triggers:
    np: [saveloy, frankfurter, frankfurt]
SICK_DAY:
  description: A day off work for illness.
  triggers:
    np: [sick day, day off sick]
TRICK:
  description: A deception or swindle.
  triggers:
    np: [a fast one, a sneaky trick, a con, a swindle]
    clause: ["{subj} {be} trying to trick {obj}", "{subj} {be} trying to con {obj}", "{subj} {be} conning {obj}"]
TANTRUM:
  description: A fit of temper (noun).
  triggers:
    np: [a tantrum, a hissy fit, a fit of temper]
ROAD:
  description: The road.
  triggers:
    np: [the road, the highway]
ENGLISH_PERSON:
  description: A person from England.
  triggers:
    np: [Englishman, Englishwoman, English person]
SCOUNDREL:
  description: A contemptible person.
  triggers:
    np: [scoundrel, lowlife, rotter, troublemaker]
LONG_TIME:
  description: A long period of time (noun).
  triggers:
    np: [a long time, ages and ages]
VIABLE:
  description: A workable proposal or feasible plan, rather than biological viability.
  triggers:
    predicate_adj: [feasible, going ahead, a viable option, a viable proposal, a workable proposal]
VIABLE_OF_LOOKS:
  description: >-
    Guard (no entries) - "she looked feasible" (an old word for presentable) and "he seems viable" are said of
    how someone looks, and the slang for a workable plan said of a woman is a sexual slur. The verbs of appearance hold it, with a
    pronoun before them where there is one (a guard right after "she" is read as a verb and refused).
  triggers:
    np: ["looked|looks|look|looking|seemed|seems|appeared feasible|viable",
         "{subj} looked|looks|seemed|seems|appeared feasible|viable", "she was|is feasible|viable"]
SCOLDING:
  description: A telling-off (noun).
  triggers:
    np: [a telling-off, a dressing-down, a tongue-lashing, an earful]
HASSLE:
  description: A difficulty or bother.
  triggers:
    np: [hassle]
TANK_TOP:
  description: A sleeveless top or undershirt.
  triggers:
    np: [tank top, undershirt, sleeveless undershirt]
EUCALYPTUS:
  description: A eucalyptus tree.
  triggers:
    np: [eucalyptus tree, eucalypt]
THROW:
  description: Throw something.
  triggers:
    # not tossing in a recipe (toss to coat, toss with the dressing)
    vp: [throw, "toss !=to|with|together|gently|well|lightly|until"]
TOSS_OTHER_SENSE:
  description: Guard (no entries) - a coin toss, the toss (cricket) and a toss-up are nouns, not throwing.
  triggers:
    np: ["coin toss", "toss of a coin", "toss-up", "toss up", "the toss"]
    vp: ["win the toss", "lose the toss", "toss the salad", "toss a salad", "toss the salads"]
CAR_TRUNK:
  description: Luggage space of a car.
  triggers:
    np: [car trunk]
ALCOHOL:
  description: Alcoholic drink, rather than technical alcohol used as solvent, fuel or disinfectant.
  triggers:
    np: [booze, liquor, strong drink, the demon drink, rotgut, hooch, an alcoholic drink]

# --- harvested from an agent's Aussie Gettysburg (aussiefy harvest), curated ------
ARRIVE:
  description: Arrive; turn up (of a person).
  triggers:
    # a person arriving: not things that turn up or show up somewhere (keys turned up in a drawer, minerals turn up
    # in a survey, changes show up correctly, a dish turns up as the bread), nor the transitive "turn up the heat".
    # (^person would be the real fix, but it doesn't reach a vp's subject.)
    vp: ["arrive", "turn up !=the|a|an|it|that|this|your|his|her|their|my|our|its|volume|heat|in|on|as|correctly|well|again|everywhere|anywhere|somewhere|nowhere|missing|dead|empty|nothing|among|inside|under",
         "show up !=the|a|an|it|that|him|her|them|me|us|you|in|on|as|correctly|well|again|everywhere|anywhere|somewhere|nowhere|clearly|better|among|inside|under"]
FRONT_UP:
  description: >-
    Present yourself to face something (front up to the boss, front up to court) (lookup only). Not plain arriving:
    families arriving at a picnic or in a new country just turn up.
  triggers:
    vp: ["present yourself in person to face the music"]
GIFT_TALENT:
  description: Guard (no entries) - a gift for something (a talent) and the gift of the gab aren't a present.
  triggers:
    # with its subject too: a noun-phrase match right after a pronoun is refused as a verb ("she has a gift for")
    np: ["{subj} {have} a gift for", "has a gift for", "have a gift for", "had a gift for", "having a gift for",
         "a natural gift for",
         "a real gift for", "a rare gift for", "a special gift for", "a great gift for", "the gift of the gab"]
BRAND_NEW:
  description: Completely new.
  not_in: [technical]   # a term of art in docs
  triggers:
    adj: ["brand new@4", "brand-new@4", "shiny new@4",
          "new !york|zealand|south|year|years|england|guinea|delhi|orleans|jersey|mexico|hampshire|testament|wave|age|moon|world@2"]
EQUALITY:
  description: Everyone is equal.
  triggers:
    clause: ["all men are created equal", "all people are created equal", "all men are equal", "everyone is equal",
             "we are all equal", "all people are equal", "everybody is equal"]
IN_THE_MIDDLE:
  description: Right in the middle of something.
  triggers:
    adv: ["right in the middle of", "in the middle of", "in the midst of", "in the thick of", "engaged in@3"]
ALIVE:
  description: Alive.
  neutral_person: true
  person: true
  triggers:
    predicate_adj: ["alive", "still alive", "still living"]
    np: ["the living !room|rooms|area|areas|space|quarters|costs|wage|standard|thing|things|creature|creatures|proof|legend|memory"]
DEAD_PEOPLE:
  description: The dead; the fallen.
  neutral_person: true
  triggers:
    np: ["honored dead", "honoured dead", "the fallen", "the dead", "the departed"]
DOWN_IN_THE_DUMPS:
  description: Guard (no entries) - "down in the dumps" is low spirits, not the tip.
  triggers:
    np: ["in the dumps"]
WAKE_THE_DEAD:
  description: Guard (no entries) - "loud enough to wake the dead" is about noise, not the dead.
  triggers:
    vp: ["wake the dead", "raise the dead"]
CARE_ABOUT:
  description: Care about something; comparative caring-less does not establish indifference.
  triggers:
    vp: [give a damn about, give a hoot about]
TALK_ON:
  description: Talk at length.
  triggers:
    vp: [ramble, go on and on, talk at length !=to, babble, prattle, drone on, 'talk {objposs} ear off', 'talk at
        length to {obj}', natter on]
TACKLE:
  description: Start on something with energy.
  triggers:
    vp: ["get to work on", "tackle", "start on", "dig into", "get going on", "set about"]
SINCERELY:
  description: An explicit assurance of honesty in speaking, not wholehearted effort or affection.
  triggers:
    adv: ["in all sincerity", "honestly and truly", "in all honesty"]
WHOLEHEARTED:
  description: Wholehearted effort, devotion or affection; not an assertion of truthfulness.
  triggers:
    adv: ["with all {poss} heart", "wholeheartedly"]
EVERYTHING:
  description: The whole lot.
  triggers:
    # not "the whole lot of you" (all of you people)
    # nor a range: "everything from country rock to jazz" (dinkum-check round)
    # A relative clause needs the original pronoun: "everything a level does", not "the whole show a level does".
    np: ["everything !=from|that|which|a|an|the|this|these|those|my|your|our|their|his|her|its|we|you|he|she|it|they", "the whole thing", "the whole lot !=of", "the entire thing", "all of it", "the whole boatload",
         "the whole shooting match"]
GOD_WILLING:
  description: Conditional hope that something will happen if God permits it; not an oath or thanks for past help.
  triggers:
    adv: ["God willing", "if God wills it"]

# --- harvested from a refined LLM Gettysburg (tests/corpus/targets), curated ------
IN_THE_END:
  description: A discourse marker for "ultimately".
  triggers:
    adv: ["in a larger sense", "ultimately", "in the end", "when all is said and done", "all things considered",
          "at the end of the day", "in the final analysis"]
NO_MATTER_WHAT:
  description: Whatever happens.
  triggers:
    # not "no matter what you do" (a clause follows): come hell or high water stands alone
    adv: ["no matter what !=you|he|she|they|we|i|it|the|a|an|happens|happened|people|anyone|anybody|your|his|her|their|our|my|its|this|that|kind|sort|type",
          "whatever happens", "at all costs", "regardless of the cost", "come what may"]
FINISH_JOB:
  description: Finish what was started.
  triggers:
    vp:
    - finish the job
    - complete the job
    - finish the task
    - complete the task
    - finish the work
    - complete the work
SECOND_CHANCE:
  description: A fresh chance at something.
  triggers:
    adv: ["a second chance at", "another chance at", "a fresh start at"]
IN_VAIN:
  description: For no result.
  triggers:
    adv: ["in vain", "for nothing", "to no avail"]
LIVE_ON:
  description: Live on; survive.
  triggers:
    # not bare "live": "where do you live?", "playing live" (the "not" can't see past the question mark)
    vp: ["survive", "go on living", "stay alive"]
PENIS:
  description: The penis (colloquial).
  triggers:
    np: ["penis"]   # not "willy": "the willies" are the creeps
SOMEONE:
  description: Some unknown person (usually a culprit).
  neutral_person: true
  triggers:
    np: ["someone", "somebody", "some person"]
SCORCHING:
  description: Far too hot.
  triggers:
    predicate_adj: ["too hot@4", "boiling hot@4", "scalding@4", "scorching@4", "boiling@4"]
FREEZING:
  description: Far too cold.
  triggers:
    predicate_adj: ["too cold@4", "freezing@4", "ice cold@4", "freezing cold@5"]
JUST_RIGHT:
  description: Exactly right.
  triggers:
    predicate_adj: ["just right", "perfect", "exactly right", "spot on"]
GREAT_EXCLAIM:
  description: An exclamation of delight.
  triggers:
    interjection: ["great", "excellent", "brilliant", "wonderful", "fantastic", "perfect", "lovely"]
TRY_OUT:
  description: Have a go at something.
  triggers:
    # not "have a go at": it is Australian already, and it is as often criticising ("having a go at popular
    # amusements") as trying
    vp:
    - try {np}
    - attempt {np}
    - give {np} a try
GOBBLE:
  description: Eat greedily and fast (no object implied).
  triggers:
    vp: ["wolf it down@4", "gobble it up@4", "polish it off@4", "eat greedily@4", "eat up@4", "gobble up@4",
         "devour@4"]
BREAK_APART:
  description: Fall to pieces; collapse.
  triggers:
    vp: ["break into pieces", "break into bits", "fall apart", "fall to pieces", "collapse", "give way"]
SMASH:
  description: Break something to pieces.
  triggers:
    vp: ["break {obj} into pieces", "break {obj} into bits", "smash {obj}", "wreck {obj}"]
FALL_OVER:
  description: Fall over (a person, a tumble).
  # in docs a system "falls over" (crashes) and you "trip over" a bug (come across it)
  not_in: [technical]
  triggers:
    # intransitive only: "tripped over the cable" and "fell down the stairs" would lose their object ("came a
    # cropper the cable")
    vp: ["fall on the floor", "fall onto the floor",
         "fall over !=the|a|an|his|her|my|your|their|our|its|it|him|them|me|us|this|that|these|those|each|one|something|someone|nothing|themselves|himself|herself|myself|yourself|backwards|board",
         "fall down !=the|a|an|his|her|my|your|their|our|its|this|that|these|those|stairs|steps",
         "trip over !=the|a|an|his|her|my|your|their|our|its|it|him|them|me|us|this|that|these|those|each|one|something|someone|nothing|themselves|himself|herself|myself|yourself|bugs|problems|issues",
         "fall flat"]
SCARED:
  description: Frightened.
  person: true
  triggers:
    predicate_adj: ["terrified@5", "scared", "frightened", "afraid !=so|not|that|i|we|you|he|she|they|it|there|this|your|my|his|her|our|their|its|the|a|an|these|those|some|no|all|most|many|any|one|nobody|nothing|everyone|everything|someone|something|people|mr|mrs|ms|dr", "scared to death@5", "petrified@5", "terrified out of {poss} wits@5", "scared shitless@5", "scared out of {poss} wits@5"]
BEEN_AT:
  description: Has been interfering with something (eating, using).
  triggers:
    adv:
    - been eating {np} ^object
    - been drinking {np} ^object
BEEN_SLEEPING_IN:
  description: Has been sleeping in.
  triggers:
    adv: ["been sleeping in"]
ANGRILY:
  description: In a bad temper.
  triggers:
    adv: ["angrily", "crossly", "furiously@4", "grumpily"]
BOY:
  description: A boy or young man.
  triggers:
    np: ["boy", "lad", "young man"]
BOYS_OTHER_SENSE:
  description: >-
    Guard (no entries) - "the boys" and "one of the boys" are a man's friends, a team or a crew of any age, not
    youths; "boys and girls" is children; "old boy", "baby boy", "oh boy" aren't a young man either.
  triggers:
    np: ["the boys", "one of the boys", "all the boys", "of the boys", "boys and girls", "girls and boys",
         "old boy", "old boys", "baby boy", "baby boys", "boys will be boys", "oh boy", "boy oh boy",
         "good old boy", "good ol' boy", "the boys in blue", "the old boys"]
MONEY:
  description: Money.
  triggers:
    np: ["money", "cash"]
MONEY_COMPOUND:
  description: >-
    Guard (no entries) - money and cash inside a name for a kind of it (pocket money, prize money, petty cash,
    a money order, cash flow): the slang can't go inside the compound.
  triggers:
    np: ["pocket money", "prize money", "seed money", "hush money", "protection money", "danger money",
         "spending money", "lunch money", "pin money", "blood money", "smart money", "money order",
         "money orders", "money market", "money markets", "money laundering", "petty cash", "cash flow",
         "cash flows", "cash register", "cash registers", "cash cow", "cash crop", "cash crops", "cash machine",
         "cash advance", "cash prize", "cash prizes"]
APARTMENT:
  description: A flat in a building.
  triggers:
    np: ["apartment", "condo", "condominium"]
SUBURB:
  description: A suburb.
  triggers:
    np: ["suburb"]
ASYLUM:
  description: A psychiatric hospital (colloquial, insensitive).
  triggers:
    np:
    - madhouse
    - insane asylum
    - mental hospital
CITY:
  description: The city, as seen from the country.
