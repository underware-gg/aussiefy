    predicate_adj: [under pressure ^person, under a lot of pressure ^person, under heavy pressure ^person, under
        enormous pressure ^person, under intense pressure ^person]
NOT_KNOW_AT_ALL:
  description: Not know someone at all, not recognise them ("not know him from Adam").
