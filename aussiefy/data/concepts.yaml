  # dismissive of a real place in a report, a notice or a doc ("the place" for a city in a news story)
  not_in: [news, official, technical, instructions]
  triggers:
    np: ["the place", "the premises", "the establishment !of"]   # not "the establishment of a tyranny"
CONGRESS:
  description: The national legislature (localised).
  # a real US Congress in a notice, a report or a policy is a fact about the US, not a place to localise
  not_in: [news, official, technical, instructions]
  triggers:
    # not the body acting ("Congress has not acted", "Congress passed"): a guard can't end on the verb, so the
    # verbs are held here
    np: ["Congress !=has|have|had|passed|acted|voted|approved|rejected|will|would|must|should|can|could|is|was|did|does|enacted|created|established|authorized|authorised|declared",
         "the Capitol", "the legislature"]
CONGRESS_ACTING:
  description: >-
    Guard (no entries) - the US Congress as the body that acts (it passed a bill, has not acted, its members) and
    institutions named after it (the Library of Congress): a fact about the US, which Parliament House misstates.
  triggers:
    vp: ["pass Congress"]   # "it passed Congress": a verb phrase, so the pronoun before it doesn't refuse it
    # "of Congress" holds members of, an act of and the Library of Congress
    np: ["U.S. Congress", "US Congress", "United States Congress", "of Congress", "through Congress", "by Congress",
         "in Congress", "to Congress"]
