# Controlled concept vocabulary.
#
# Every entry's `concept` must name one of these IDs. `triggers` are plain-English
# patterns, grouped by the grammatical frame they appear in. They drive detection
# alongside each entry's own `replaces`. A trailing @N sets the intensity (1-5) the
# paraphrase expresses; the default is 3. `person: true` means the concept describes
# a person, so clause idioms with a {subj} slot may bind to it.
#
# The vocabulary is hand-curated. The LLM tagging pass may propose new IDs, which
# a human consolidates here (see aussiefy/scrape/tag.py).

# --- contextual imagery and precise senses ----------------------------------
DISHONEST:
  # Provisional wording/search recommendation, Gate 4, 2026-11-14; see Rulings for Rob.
  plain: dishonest
  search_words: [untrustworthy, deceitful]
  description: Dishonest or untrustworthy; not physical bending or poor workmanship.
  triggers:
    predicate_adj:
    - dishonest
    - untrustworthy
FUTILE_EFFORT:
  plain: work in vain
  examples: [They worked in vain.]
  description: Working without useful effect, despite effort.
  person: true
  triggers:
    vp: [work in vain, labour in vain, labor in vain, toil in vain]
    clause: ['{subj} {be} working in vain', '{subj} {be} labouring in vain', '{subj} {be} toiling in vain']
  search_words: [in vain, futile, pointless, wasted effort]
BREATHLESS:
  description: Physically short of breath.
  person: true
  triggers:
    predicate_adj: [out of breath ^person, puffing and panting ^person]
  plain: out of breath
  search_words: [puffed]
  examples: [I was out of breath after the stairs., She was puffing and panting at the top.]
  negative_examples: [The rice was puffed., His face was puffed up., He was puffed up with pride.]
RESTLESS_SLEEP:
  plain: toss and turn
  examples: [I was tossing and turning.]
  description: Tossing and turning while trying to sleep.
  person: true
  triggers:
    clause: ['{subj} {be} tossing and turning ^end', '{subj} {be} turning and tossing ^end', '{subj} {be} tossing
        and turning in bed ^end', '{subj} {be} turning and tossing in bed ^end']
    vp: [toss and turn ^end, turn|turns|turned|turning and toss|tosses|tossed|tossing ^end, toss|tosses|tossed|tossing
        and turn|turns|turned|turning ^end, turn|turns|turned|turning and toss|tosses|tossed|tossing in bed ^end,
      toss|tosses|tossed|tossing and turn|turns|turned|turning in bed ^end, toss restlessly ^end, toss about in
        bed ^end, toss around in bed ^end]
  search_words: [restless night, can't sleep, sleepless]
ERRATIC_THINKING:
  # Provisional search words, Gate 4, 2026-11-14; approved display wording retained.
  search_words: [circular thinking, thinking without progress]
  plain: think in circles
  examples: [I am thinking in circles.]
  description: Thinking in circles without reaching a conclusion.
  person: true
  triggers:
    clause: ['{subj} {be} thinking in circles']
  plain_forms: {clause: '{subj} {be} going round in circles'}
SELFISH:
  description: Selfishly disregarding the needs of other people.
  person: true
  triggers:
    predicate_adj: [selfish ^person]
  plain: selfish
  search_words: [self-centred, self-absorbed, only thinks of themselves]
  examples: [He is selfish.]
  negative_examples: [Her brother is callous.]
PERSONAL_ENERGY:
  # Provisional wording/search recommendation, Gate 4, 2026-11-14; see Rulings for Rob.
  plain: energy to act
