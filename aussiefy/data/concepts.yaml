THINK:
  description: Hold or express an opinion or belief that something is the case; suppose.
  triggers:
    vp: [think !about|of|over|through|up|back|ahead|twice|again, believe !in|me|you|it, suppose !to]
  plain: suppose
  search_words: [think, guess, figure]
  plain_forms: {vp: think}
# Readings of think and believe that their complements establish. They hold the verb without claiming its
# object, which keeps its own words and their swaps ("believe a liar": a bullshitter is still one).
ACCEPT_AS_TRUE:
  plain: believe what you're told
