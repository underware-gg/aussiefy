    vp: [screw up, mess up !=the|a|an|his|her|my|your|their|our|its|this|that|these|those|hair|room|kitchen|house|bed|desk|place|everything|me|him|them|us,
      botch, bungle, foul up]
BLUNDER:
  description: A bad mistake that spoils something, a bungle (not a plain error of fact).
