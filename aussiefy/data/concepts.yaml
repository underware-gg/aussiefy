# Controlled concept vocabulary.
#
# Every entry's `concept` must name one of these IDs. `triggers` are plain-English
# patterns, grouped by the grammatical frame they appear in. They drive detection
# alongside each entry's own `replaces`. A trailing @N sets the intensity (1-5) the
# paraphrase expresses; the default is 3. `person: true` means the concept describes
# a person, so clause idioms with a {subj} slot may bind to it.
#
# The vocabulary is hand-curated. The LLM tagging pass may propose new IDs, which
# a human consolidates here (see aussiefy/scrape/tag.py).

# --- contextual imagery and precise senses ----------------------------------
DISHONEST:
  description: Dishonest or untrustworthy; not physical bending or poor workmanship.
  triggers:
    predicate_adj:
    - dishonest
    - untrustworthy
FUTILE_EFFORT:
  description: Working without useful effect, despite effort.
  person: true
  triggers:
    vp:
    - work in vain
    - labour in vain
    - labor in vain
    - toil in vain
    clause:
    - '{subj} {be} working in vain'
    - '{subj} {be} labouring in vain'
    - '{subj} {be} toiling in vain'
BREATHLESS:
  description: Physically short of breath.
  person: true
  triggers:
    predicate_adj:
    - out of breath ^person
    - puffing and panting ^person
RESTLESS_SLEEP:
  description: Tossing and turning while trying to sleep.
  person: true
  triggers:
    clause:
    - '{subj} {be} tossing and turning ^end'
    - '{subj} {be} turning and tossing ^end'
    - '{subj} {be} tossing and turning in bed ^end'
    - '{subj} {be} turning and tossing in bed ^end'
    vp:
    - toss and turn ^end
    - turn|turns|turned|turning and toss|tosses|tossed|tossing ^end
    - toss|tosses|tossed|tossing and turn|turns|turned|turning ^end
    - turn|turns|turned|turning and toss|tosses|tossed|tossing in bed ^end
    - toss|tosses|tossed|tossing and turn|turns|turned|turning in bed ^end
    - toss restlessly ^end
    - toss about in bed ^end
    - toss around in bed ^end
ERRATIC_THINKING:
  description: Thinking in circles without reaching a conclusion.
  person: true
  triggers:
    clause:
    - '{subj} {be} thinking in circles'
SELFISH:
  description: Selfishly disregarding the needs of other people.
  person: true
  triggers:
    predicate_adj:
    - selfish ^person
    - callous ^person
PERSONAL_ENERGY:
  description: Personal energy and willingness to take action.
  triggers:
    np:
    - energy and enthusiasm
    - energy and initiative
WILD_EXCITEMENT:
  description: React with exuberant energy or party wildly; not ordinary interest or a fit of anger.
  triggers:
    vp: [go wild with excitement, party wildly, party energetically]
LIVELY_PARTY:
  description: A lively social party, explicitly described as wild, energetic or in full swing.
  triggers:
    np: ["wild party !=conference|conferences|leader|leaders|member|members|candidate|candidates|delegate|delegates|committee|policy|policies|manifesto|platform|headquarters|politics|planner|planners|planning|game|games|trick|tricks",
         "lively party !=conference|conferences|leader|leaders|member|members|candidate|candidates|delegate|delegates|committee|policy|policies|manifesto|platform|headquarters|politics|planner|planners|planning|game|games|trick|tricks",
         "energetic party !=conference|conferences|leader|leaders|member|members|candidate|candidates|delegate|delegates|committee|policy|policies|manifesto|platform|headquarters|politics|planner|planners|planning|game|games|trick|tricks",
         party in full swing]
WHOLEHEARTED_ATTEMPT:
  description: Make a serious effort; not suffering hardship or fighting physically.
  triggers:
    vp: [give it everything ^end, try hard ^end, make a real effort ^end, give it a real try ^end]
UNEMPLOYMENT_BENEFIT_RECIPIENT:
  description: Receiving unemployment payments; joblessness alone does not establish this.
  person: true
  triggers:
    predicate_adj: [on unemployment benefits, receiving unemployment benefits, on jobseeker payments]
DOLE_BLUDGER:
  description: An accusation of deliberately avoiding work while living on unemployment payments.
  triggers:
    np: [work-shy unemployment benefits claimant, work-shy unemployment benefit claimant]
QUIT_COMMAND:
  description: A command to stop the current activity; not giving up a named object or habit.
  triggers:
    imperative:
    - quit
    - give up
NAKED:
  description: A person without clothes.
  person: true
  triggers:
    predicate_adj:
    - naked ^person
    - unclothed ^person

# --- states and traits --------------------------------------------------------
BUSY:
  description: Having a great deal to do.
  person: true
  triggers:
    predicate_adj: ["busy@2", "swamped@4", "snowed under@4", "run off {poss} feet@4", "flat out@4",
                    "overloaded@3", "up to {poss} eyeballs@4", "rushed off {poss} feet@4", "slammed@4"]
FRANTIC_ACTIVITY:
  description: Rushing around in a frenzy of physical activity.
  person: true
  triggers:
    vp: ["rush around frantically ^end", "run around frantically ^end", "rush about frantically ^end"]
CRAZY:
  description: Mentally unbalanced, irrational, or acting wildly.
  person: true
  triggers:
    predicate_adj: ["crazy", "mad", "nuts", "insane@4", "out of {poss} mind@4", "bonkers", "loopy",
                    "deranged@4", "unhinged@4", "irrational@2", "losing it", "off {poss} rocker"]
STUPID:
  description: Unintelligent or foolish.
  person: true
  triggers:
    # "thick" of a person only: thick air, thick with vapour, a thick mixture are dense
    predicate_adj: ["stupid", "dumb", "thick !=with|and ^person", "dim@2", "brainless@4", "clueless@2", "an idiot@3", "a moron@4",
                    "a fool@2", "not very bright@2"]
IDIOT:
  description: A foolish person (as a noun).
  triggers:
    np: ["idiot", "fool", "moron@4", "dimwit", "nitwit@2", "dummy@2", "twit@2"]
ALL_TALK:
  description: Boastful without substance; talks big, delivers little.
  person: true
  triggers:
    predicate_adj: ["all talk", "all talk and no action@4", "full of hot air", "a big talker", "a show-off",
                    "full of it", "nothing but talk"]
BOASTER:
  description: A person who boasts or shows off.
  triggers:
    np: ["show-off", "braggart", "boaster", "big talker"]
ANGRY:
  description: Annoyed, cross or furious.
  person: true
  triggers:
    predicate_adj: ["angry", "furious@4", "livid@5", "annoyed@2", "cross@2", "mad at {obj}", "fuming@4",
                    "irritated@2", "pissed off@4", "grumpy@2", "in a bad mood@2", "irate@4", "enraged@5", "incensed@4", "seething@5"]
LOSE_TEMPER:
  description: To suddenly become angry; throw a tantrum.
  triggers:
    vp: ["lose {poss} temper", "throw a tantrum@4", "have a tantrum@4", "fly off the handle@4", "blow up@4",
         "get angry", "have a meltdown@4", "lose {poss} cool"]
OVERREACT:
  description: Make an excessive fuss; behave dramatically.
  triggers:
    vp: ["overreact", "make a fuss", "make a scene@4", "make a song and dance", "kick up a fuss@4"]
    predicate_adj: ["being dramatic", "being ridiculous", "being a drama queen", "making a fuss"]
COMPLAIN:
  description: Complain persistently.
  triggers:
    vp: ["complain", "moan", "whine", "grumble@2", "gripe"]
COMPLAINER:
  description: A habitual complainer.
  triggers:
    np: ["complainer", "moaner", "whiner", "crybaby", "cry-baby"]
TIRED:
  description: Exhausted, worn out.
  person: true
  triggers:
    # ^person: said of things too ("the tank was drained", "the data is wiped out", "done in any case")
    predicate_adj: ["tired@2", "exhausted@4", "worn out ^person@4", "wiped out ^person@4", "shattered ^person@4",
                    "drained ^person@3", "dead on {poss} feet@5", "knackered@4", "fatigued", "weary",
                    "done in ^person", "tired out", "bone-tired@4"]
BROKEN:
  description: Not working; ruined or beyond repair.
  triggers:
    predicate_adj: ["broken", "ruined@4", "busted", "not working@2", "beyond repair@5", "wrecked@4"]
BROKEN_OTHER_SENSE:
  description: >-
    Guard (no entries) - a heart, a silence, a record, a promise or the law broken isn't out of order. An np
    frame, so the noun that starts each phrase isn't refused as a verb.
  triggers:
    np: ["heart was broken", "heart is broken", "hearts were broken", "hearts are broken", "heart had been broken",
         "silence was broken", "silence is broken", "spell was broken", "spell is broken", "record was broken",
         "record is broken", "records were broken", "promise was broken", "promises were broken",
         "law was broken", "laws were broken", "rules were broken", "rule was broken", "ice was broken",
         "news was broken", "deadlock was broken", "fast was broken", "will was broken", "spirit was broken",
         "was broken-hearted", "was heartbroken"]
USELESS:
  description: Of no use or help at all.
  person: true
  triggers:
    predicate_adj: ["useless", "pointless@2", "hopeless", "no use", "no help", "worthless@4", "a waste of space@4"]
UGLY:
  description: Unattractive in appearance.
  person: true
  triggers:
    predicate_adj: ["ugly", "hideous@4", "unattractive@2", "not much to look at@2"]
HAPPY:
  description: Pleased, delighted.
  person: true
  triggers:
    predicate_adj: ["happy@2", "delighted@4", "thrilled@4", "over the moon@4", "very pleased@3", "ecstatic@5",
                    "pleased@2", "excited@3", "chuffed@3", "elated@4", "jubilant@4", "overjoyed@4", "euphoric@5"]
GET_EXCITED:
  description: >-
    Guard (no entries) - "get excited" is getting worked up or enthused (a mare gets excited and desperate near the
    end of a race; young coders get excited by learning), not delighted at how something turned out.
  triggers:
    vp: ["get excited", "get all excited", "get so excited", "get too excited", "get overexcited"]
DISAPPOINTED:
  description: Upset or disappointed about an outcome.
  person: true
  triggers:
    predicate_adj: ["disappointed", "gutted@4", "upset", "devastated@5", "bummed@3", "heartbroken@5"]
SICK:
  description: Unwell.
  person: true
  triggers:
    predicate_adj: ["sick", "ill", "unwell", "poorly@2", "under the weather@2", "not well@2"]
DRUNK:
  description: Intoxicated by alcohol.
  person: true
  trigger_degrees:
    predicate_adj:
      drunk: unmarked
      wasted@4: strong
      hammered@4: strong
      plastered@4: strong
      smashed@4: strong
      tipsy@2: mild
      intoxicated@3: unmarked
      legless@5: strong
      inebriated@4: unmarked
      tiddly@2: mild
  triggers:
    predicate_adj: ["drunk", "wasted@4", "hammered@4", "plastered@4", "smashed@4", "tipsy@2", "intoxicated@3",
                    "legless@5", "inebriated@4", "tiddly@2"]
FULL:
  description: Having eaten as much as one can.
  person: true
  triggers:
    predicate_adj: ["full ^person@3", "stuffed ^person@4", "so full ^person@4", "full up@3"]   # a tank is full too
HUNGRY:
  description: Wanting food.
  person: true
  unless_after: [for, to]
  triggers:
    predicate_adj: ["hungry@3", "starving@4", "famished@4", "ravenous@5", "peckish@2"]
    vp: ["feel pretty? hungry ^end"]
THIRSTY:
  description: Wanting a drink.
  person: true
  triggers:
    predicate_adj: ["thirsty@3", "parched@4", "dying for a drink@4", "gasping for a drink@4"]
STINGY:
  description: Unwilling to spend money.
  person: true
  triggers:
    predicate_adj: ["stingy", "mean with money", "tight-fisted@4", "miserly@4"]
LAZY:
  description: Unwilling to work.
  person: true
  triggers:
    predicate_adj: ["lazy", "idle@2", "work-shy@4", "bone idle@5"]
SLACKER:
  description: Someone who avoids work or lives off others.
  triggers:
    np: ["slacker", "freeloader", "layabout", "lazybones", "loafer", "scrounger"]
SLACK_OFF:
  description: Avoid work; loaf.
  triggers:
    vp: ["slack off", "loaf around", "laze around", "skive off", "freeload", "goof off"]
GENUINE:
  description: Real, honest, true.
  triggers:
    predicate_adj: ["genuine", "honest", "authentic", "the real deal"]
    adj: ["genuine", "authentic"]
SHOWY:
  description: Flashy, ostentatious.
  person: true
  triggers:
    adj: ["swanky"]
    predicate_adj: ["flashy", "showy", "ostentatious@4", "dressed to the nines@4"]
FAR_AWAY:
  description: A very remote place.
  triggers:
    np: ["the middle of nowhere", "the back of beyond", "the boondocks", "the sticks"]
EVERYONE:
  description: Absolutely everybody.
  noun_use: reference
  neutral_person: true
  # a policy's, a doc's or a report's "everyone" is a plain quantifier ("one price for everyone", "let everyone
  # know" in an obituary): every man and his dog and every bastard are a crowd's hyperbole (dinkum-check round)
  not_in: [official, technical, news, instructions]
  triggers:
    np: ["everyone !=else", "everybody !=else", "the whole world"]   # "every bugger else" isn't said
PLURAL_ADDRESS:
  description: Speaking directly to a group of people.
  noun_use: address
  neutral_person: true
  triggers:
    np: [everyone, everybody]
NOTHING:
  description: Nothing at all; very little.
  # a policy's or a doc's "nothing" is a logical quantifier ("Nothing in this communication is advice"), not a
  # quantity: bugger all and zilch are out there
  not_in: [official, technical]
  triggers:
    # not "not much of a housekeeper" (a predicate: "bugger all of a housekeeper" isn't English)
    # nor "nothing but/else/more than/like" (only, just): bugger all is a quantity
    np: ["nothing !=but|else|more|less|like|short", "nothing at all@4", "very little@2", "not much !=of@2", "zilch@4"]   # not "zero": the zero ciphertext
NO_CHANCE:
  description: No chance at all.
  triggers:
    np: ["no chance", "no chance at all@4", "a snowball's chance in hell@5", "zero chance@4", "no hope"]
MESS:
  description: A muddle, a botched job.
  triggers:
    np: ["a mess", "a shambles@4", "a disaster@4", "a botched job", "a fiasco@4", "chaos@4", "a debacle@4",
         "a free-for-all@4"]
BOTCH_IT:
  # apart from BOTCH (dinkum-check round): stuff {obj} up keeps the object in its place ("screwed it up" -> "stuffed
  # it up"); in BOTCH, stuff up's form would be picked as often and lose it
  description: Get something badly wrong, with what was spoiled between the verb and its particle ("screwed it up").
  triggers:
    vp: ["screw {obj} up", "foul {obj} up", "make a mess of {obj}"]
SCREW_UP_FACE:
  description: >-
    Guard (no entries) - screwing up a face or the eyes (squinting, grimacing) or one's courage isn't getting
    something wrong.
  triggers:
    vp: ["screw up {poss} face|eyes|nose|mouth|courage", "screw {poss} face|eyes|nose|mouth up",
         "screw up the paper", "screw up the letter"]
NONSENSE:
  description: Untrue or foolish talk.
  triggers:
    np: ["nonsense", "baloney", "hogwash", "a load of rubbish", "a load of nonsense", "a load of garbage", "bullshit",
         "a load of bullshit"]
LOOK:
  description: A quick look.
  triggers:
    np: ["a look !of|on", "a quick look", "a peek@2", "a quick glance@2"]   # not "at a glance", "a look of horror on her face"
TRY:
  description: An attempt.
  triggers:
    np: ["a try", "a go", "an attempt", "a real try@4", "a serious attempt@4", "a good try@4"]
WORK:
  description: Work or labour as an activity; context-dependent general work remains discoverable.
  triggers: {}
  lookup_only: true
EXCELLENT:
  description: Very good, first-rate.
  triggers:
    # "great" also means large or eminent ("a great war", "a great deal", "a great man"); block those senses
    adj: ["great !big|little|huge|large|war|wars|battle|battles|battle-field|task|deal|many|number|majority|extent|length|distance|sense|care|pains|importance|power|powers|nation|nations|man|men|leader|leaders|depression|wall|lakes|plains|barrier|britain|grandfather|grandmother|aunt|uncle|fire|flood|famine|loss|danger|cause",
          "excellent@4", "fantastic@4", "wonderful@4", "terrific@4", "awesome@4",
          # "brilliant" of a person or a mind is clever, and of a light or a colour is bright: neither is beaut
          "brilliant !=young|mind|minds|scientist|scientists|student|students|mathematician|mathematicians|engineer|engineers|coder|coders|programmer|programmers|thinker|thinkers|scholar|scholars|lawyer|lawyers|doctor|doctors|writer|writers|man|men|woman|women|people|person|boy|boys|girl|girls|kid|kids|child|children|light|lights|sunshine|sunlight|sun|white|blue|red|green|yellow|colour|colours|color|colors|flash|star|stars@4",
          "superb@4", "amazing@4", "first-rate@4", "splendid@4"]
    predicate_adj: ["great", "excellent@4", "fantastic@4", "awesome@4", "amazing@4", "brilliant@4"]
GOOD:
  description: Pleasing, nice (of a thing, a day, the weather).
  triggers:
    # not a bare "good": good friends (close), good riddance, a good imitation (passable), good work (well done),
    # a good sport, a good seal (tight) - beaut is pleasing to look at or have, and "good" is mostly other senses.
    # "nice" and "lovely" not of people, a compliment or "nice to/of" (it was nice of you, nice to meet you)
    adj: ["nice !=of|to|work|job|try|one|guy|guys|man|men|woman|women|lady|ladies|girl|girls|boy|boys|kid|kids|people|person|bloke|fellow|chap|and|enough@2",
          "lovely !=of|to|work|job|man|men|woman|women|lady|ladies|girl|girls|boy|boys|kid|kids|people|person|and@3"]
VERY:
  description: Intensifier.
  triggers:
    adv: ["very", "really ^adj", "extremely@4", "seriously@4", "absolutely@4", "thoroughly@4", "completely@4"]
A_LOT:
  description: A large amount; many.
  triggers:
    np: ["a lot@3", "lots@3", "loads@3", "tons@3", "plenty@3", "a great deal@3", "masses@4"]
    adv: ["a lot", "very much"]
COUNTED_LOTS:
  description: >-
    Guard (no entries) - loads and lots that are counted units (60 loads of dishes, a load of washing, parking
    lots, lots at an auction), not "a large amount".
  triggers:
    np: ["loads of dishes", "loads of washing", "loads of laundry", "loads of wash", "loads of washing-up",
         "parking lots", "car lots", "vacant lots", "empty lots", "building lots", "auction lots",
         # a counted number of lots is groups (split into four lots), not a large amount (dinkum-check round)
         "two lots", "three lots", "four lots", "five lots", "six lots", "seven lots", "eight lots", "nine lots",
         "ten lots", "both lots", "several lots", "separate lots", "multiple lots"]
DEFINITELY:
  description: Certainly, without doubt.
  triggers:
    adv: ["definitely", "certainly", "for sure"]
FAST:
  description: Quickly.
  triggers:
    adv: ["very fast@4", "really quickly@4", "at top speed@4", "very quickly@4", "as fast as {subj} could@4",
          "as quickly as {subj} could@4", "as fast as possible@4", "on the double", "double-quick", "in double-quick time"]
    predicate_adj: ["very fast@4", "really quick@4", "lightning fast@5"]

# --- people and things ----------------------------------------------------
FRIEND:
  description: A friend or companion.
  triggers:
    np: ["friend", "buddy", "pal", "chum", "companion"]
MAN:
  description: A man, a guy.
  triggers:
    np: ["man", "guy", "chap", "bloke"]
FELLOW_MAN:
  description: The noun "fellow", a man.
  # in a report, a policy or a doc "fellow" is nearly always the adjective (fellow Grateful Dead alumni, fellow
  # members), and a multi-word name after it can't be held by a guard
  not_in: [news, official, technical]
  triggers:
    # not the adjective before a noun (fellow alumni, fellow citizens); before a one-word name ("fellow Texans") it
    # is held by FELLOW_BEFORE_NAME. Before a longer name ("fellow Grateful Dead alumni") nothing holds it: a span
    # that holds part of a multi-word name is refused, guards too (DECISIONS.md, needs engine changes)
    np: ["fellow !=alumni|alumnus|members|member|citizens|citizen|countrymen|students|student|workers|worker|travellers|travelers|traveller|traveler|passengers|soldiers|officers|players|musicians|artists|writers|parishioners|competitors|human|humans|feeling|employees|colleagues|team|band|americans|australians|residents|veterans|believers|scientists|researchers|creatures|sufferers|survivors|inmates|prisoners|delegates|candidates|nominees"]
FELLOW_BEFORE_NAME:
  description: >-
    Guard (no entries) - "fellow" before a one-word name is the adjective (fellow Texans, fellow Democrats), not a
    man.
  triggers:
    np: ["fellow {obj}"]
WOMAN:
  description: A woman.
  triggers:
    np: ["woman", "lady"]
GOOD_PERSON:
  description: A thoroughly decent person.
  triggers:
    np: ["a nice guy", "a good guy", "a decent person", "a good person", "a good man", "a top person",
         "a great guy@4"]
CHAMPION_PERSON:
  # apart from GOOD_PERSON: "a good man" (a virtuous parson) is decent, not a champion
  description: Someone admired as outstanding, a star or a hero.
  triggers:
    np: ["an absolute star", "an absolute champion", "an absolute hero", "a real hero", "a true hero"]
BREAKFAST:
  description: Breakfast.
  triggers:
    np: ["breakfast"]
BREAKFAST_IDIOM:
  description: Guard (no entries) - a dog's breakfast is a mess (its own entry), not the morning meal.
  triggers:
    np: ["dog's breakfast", "dogs breakfast", "dog’s breakfast"]
AFTERNOON:
  description: The afternoon.
  triggers:
    np: ["afternoon"]
BARBECUE:
  description: A barbecue grill or the event.
  triggers:
    np: ["barbecue", "barbeque", "bbq", "the outdoor grill", "a gas grill", "a charcoal grill", "the backyard grill", "a barbecue grill"]
SAUSAGE:
  description: A sausage.
  triggers:
    np: ["sausage"]
SANDWICH:
  description: A sandwich.
  triggers:
    np: ["sandwich"]
BISCUIT:
  description: A biscuit or cookie.
  not_in: [technical]   # a term of art in docs
  triggers:
    np: ["biscuit", "cookie"]
WEB_COOKIE:
  description: >-
    Guard (no entries) - a browser's cookie, in a how-to as in the docs ("delete the session cookie"), isn't a
    bickie. The phrases a web cookie comes in hold it.
  triggers:
    np: ["session cookie", "session cookies", "browser cookie", "browser cookies", "tracking cookie",
         "tracking cookies", "third-party cookie", "third-party cookies", "first-party cookies", "http cookie",
         "http cookies", "cookie settings", "cookie banner", "cookie policy", "cookie consent", "cookie file",
         "cookie files", "accept cookies", "accept all cookies", "delete cookies", "clear cookies",
         "clear your cookies", "enable cookies", "block cookies", "disable cookies", "cookies and site data", "uses cookies",
         "use cookies", "store cookies", "set cookies", "sets a cookie", "set a cookie"]
CHOCOLATE:
  description: Chocolate.
  # a box of chocolates as a corporate gift in a policy, or a cookie's value in a doc, isn't choccy
  not_in: [official, technical]
  triggers:
    np: ["chocolate"]
AVOCADO:
  description: An avocado.
  triggers:
    np: ["avocado"]
VEGETABLES:
  description: Vegetables.
  triggers:
    np: ["vegetables", "veggies"]
BEER:
  description: Beer as a beverage, without asserting a particular package or count.
  triggers:
    np: [beer]
TEA:
  description: A cup of tea.
  triggers:
    np: ["cup of tea"]
MCDONALDS:
  description: McDonald's restaurants.
  triggers:
    np: ["McDonald's", "McDonalds"]
LIQUOR_STORE:
  description: A shop selling alcohol.
  triggers:
    np: ["liquor store", "bottle shop", "off-licence"]
