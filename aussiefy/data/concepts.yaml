RETIRED_STATE:
  description: >-
    Guard (no entries) - being retired is a state ("she is retired now") or a passive ("the ship was retired"),
    not the act ("she is pulled the pin" isn't English); and "retiring" is also shy.
  triggers:
    # a pronoun subject's state ("they are retired"), and a passive with any subject ("the ship was retired in 1990")
    clause: ["{subj} {be} retired", "{subj} {be} now retired", "{subj} {be} long retired", "{subj} {be} semi-retired"]
    # (a vp's "be" inflects to is/was/been/being only, so "are" and "were" are their own)
    vp: ["be retired", "be now retired", "be long retired", "be semi-retired", "are retired", "were retired"]
    # and the adjective "retiring", shy
    np: ["shy and retiring", "quiet and retiring", "modest and retiring", "a retiring nature", "a retiring type"]
RETIRE:
  # dinkum-check round: carries pull the pin (also QUIT), so by hand
  description: Retire from work or from playing, for good.
  triggers:
    # retiring for good, without an object: not "retire to bed" or "retired to the lounge" (withdraw), "retire
    # from" (pull the pin on is calling a thing off), "retire a debt" or "a jersey", a cricketer "retired hurt",
    # "retire on a pension" (pull the pin on)
    # nor a glossary's or a list's "retire; withdraw", "Retiring; reticent" (shy), cut off by a semicolon
    vp: ["retire !=to|from|on|the|a|an|his|her|its|their|our|my|your|it|them|this|that|hurt|into|;"]
QUIT:
  description: Quit, give up.
  triggers:
    vp: ["quit !of ^end", "give up ^end", "call it quits ^end", "resign ^end", "throw in the towel ^end"]   # "be quit of them": be rid
FED_UP:
  description: Fed up; had enough.
  triggers:
