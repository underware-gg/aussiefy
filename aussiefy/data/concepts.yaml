  triggers:
    np: ["food !coloring|colouring|safety|poisoning|processor|processors|chain|bank|banks|court|truck|stamps|service|industry|label|labels|allergy|allergies|group|groups|grade|science|handling|supply|waste|storage|packaging|thermometer|additives|dye|dyes|production|prices|security|preparation|contact|temperature|temperatures|item|items|product|products|container|containers|type|types|borne|and",
         "provisions"]
FOODS_PLURAL:
  description: >-
    Guard (no entries) - "foods" is kinds of food, counted ("thick foods are cooked", "processed foods"); the swap
