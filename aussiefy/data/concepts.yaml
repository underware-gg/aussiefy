  triggers:
    vp: ["terrify {obj}", "frighten {obj} badly", "scare {obj} badly", "scare {obj} to death"]
CONSTRUCT:
  description: Build or put something together, often quickly or roughly.
  not_in: [technical]   # a term of art in docs
  triggers:
    # not a bare "build": knocking together is building quickly and roughly, and most building isn't (a house, a
    # relationship, an auction program, a site; a threat builds; built on infrastructure). The fourth pass's agents
    # declined it in four texts after the third pass's long exclusion list.
    vp: ["throw together", "cobble together", "slap together", "rig up"]
EAGER_FOR:
  description: >-
    Dying to do something, dying for something: eager, not dying. No entries on purpose: the longer match keeps
