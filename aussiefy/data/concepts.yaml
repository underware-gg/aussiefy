  triggers:
    np: [quite a lot, quite a bit, a fair amount]
    adv: [quite a lot, quite a bit, considerably ^adj]
DEAD_EASY:
  description: Very easy, no trouble at all (as a predicate, with nothing after it).
  triggers:
    predicate_adj: [very easy !=to|for, really easy !=to|for, easy as pie, a piece of cake]
ALL_DONE:
