  person: true
  triggers:
    predicate_adj: [lonely, feeling lonely]
SCREAM:
  description: Scream, shriek.
  triggers:
    vp: ["scream", "shriek", "yell their heads off"]
CRY:
  description: Cry, weep.
  triggers:
    vp: ["weep", "sob", "bawl", "burst into tears"]   # not "cry": usually a speech verb in stories
FRIGHTEN:
  description: Frighten.
  triggers:
    vp: ["frighten", "scare", "terrify"]
WORK_HARD:
  description: Work extremely hard.
  triggers:
    vp: ["break {poss} backs", "break {poss} back", "work {poss} fingers to the bone", "slave away", "toil"]
SAY_GOODBYE:
  description: Say goodbye.
  triggers:
    vp: ["bid farewell", "say goodbye", "say farewell", "bid goodbye"]
LOUNGE_ROOM:
  description: The living room.
  triggers:
    np:
    - living room
    - sitting room
    - family room
SIT_DOWN:
  description: Sit down heavily or casually.
  triggers:
    vp: ["sit down", "flop down", "slump down", "take a seat"]
FOOD:
  description: Food.
  # a doc's or a policy's food is a term (food safety rules, food products), not tucker
