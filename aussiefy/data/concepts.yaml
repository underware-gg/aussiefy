WORKED_UP:
  description: Agitated, worked up (of a person).
  triggers:
    predicate_adj: [worked up ^person, all worked up]
STAGGERED:
  description: Badly shaken, thrown off balance by a blow or bad news (of a person).
  triggers:
    predicate_adj: [thrown for a loop, floored ^person, knocked sideways ^person]
STAGGER_SOMEONE:
  description: Shake someone badly, throw them off balance (of news or a blow).
  triggers:
    vp: ['throw {obj} for a loop', 'knock {obj} sideways']
FRIDGE:
  description: A refrigerator (the appliance, not a refrigerated truck or rail car).
  triggers:
    np: [refrigerator !=car|cars|truck|trucks|van|vans|ship|ships]
GET_ON_THE_PHONE:
  description: Get on the phone, ring someone up.
  triggers:
    vp: [get on the phone]
GO_OFF_FOOD:
