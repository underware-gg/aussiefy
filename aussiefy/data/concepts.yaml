    predicate_adj: [very eager ^person, really eager ^person, extremely eager ^person, raring to go ^person]
KEEN_ON:
  description: Enthusiastic about a thing or an idea, into it. Not "fond of", which can be said of a person with
    no romance in it (and "keen on her" has some).
