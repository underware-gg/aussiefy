# --- speech acts --------------------------------------------------------------
NO_PROBLEM:
  description: Reassurance; no trouble at all; you're welcome.
  triggers:
    interjection: ["no problem", "no problem at all", "you're welcome", "don't worry", "don't worry about it",
                   "not a problem", "it's no trouble", "that's fine", "it's fine", "that's okay", "no trouble",
                   "never mind", "it's all good", "all good"]
IT_WILL_BE_OK:
  description: Everything will turn out fine.
  triggers:
    interjection: ["it will be fine", "it'll be fine", "it will be okay", "it'll be okay", "everything will be fine",
                   "everything will be okay", "it'll work out", "it will all work out", "don't panic"]
EASY:
  description: Agreement that a task is simple / done gladly.
  triggers:
    interjection: ["easy", "that's easy", "consider it done", "sure thing", "happy to help", "no sweat"]
AGREE:
  description: Emphatic yes.
  triggers:
    # "of course" agrees as a reply ("Of course."); before a comma it's the adverb ("Of course, the river ...")
    interjection: ["absolutely", "definitely", "of course !=,|;|—|-", "you bet", "too right", "exactly", "certainly",
                   "for sure", "yes, absolutely@4", "yes, definitely@4", "you're right"]
DISAGREE:
  description: Dissent without asserting emphatic refusal.
  triggers:
    interjection:
    - 'no'
    - I don't think so@2
    - nope
REALLY_Q:
  description: Expressing disbelief; "really?"
  triggers:
    interjection: ["really", "seriously", "is that true", "honestly", "are you serious", "are you kidding",
                   "are you joking", "no kidding", "you're kidding", "you're joking"]
SURPRISE:
  description: Exclamation of surprise or dismay.
  triggers:
    interjection: ["wow", "good grief", "goodness", "my goodness", "oh my god@4", "oh my gosh", "good heavens",
                   "goodness me", "gosh", "golly", "oh dear", "blimey", "holy cow", "well I never",
                   "I can't believe it", "unbelievable"]
GREETING:
