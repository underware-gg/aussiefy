# --- fourth-pass round 2026-10-14, by hand (research/fourth-pass-round-2026-10-14) -------------------------
# Outside the round's section: each needs a not_in, or carries an existing entry (a round writes neither).
MEDAL_AWARD:
  description: A medal or an award won (for bravery, a prize, an honour).
  # an award in official or technical prose is a pay agreement or a contract (the industrial award)
  not_in: [official, technical]
  triggers:
    np: ["a medal !=of", "an award !=of|ceremony|ceremonies|winning|winner|winners|rate|rates|wage|wages"]
TOLERATE:
  description: Tolerate, put up with something unwelcome.
  triggers:
    vp: ["put up with {np}"]
ELDERLY:
  description: Old people in general (the elderly), not one's parents.
  # casual for a group of people: not in a report, a notice, a doc or a policy
  not_in: [news, official, technical, instructions]
  triggers:
    np: ["the elderly", "elderly people", "old people", "older people", "the aged !=care|pension|pensions|pensioner|pensioners"]
EMPHATIC_REFUSAL:
  description: An emphatic refusal or categorical denial.
  triggers:
    interjection:
    - no way@4
    - not a chance@4
    - absolutely not@5
    - certainly not@5
    - over my dead body@5
DOUBLE_NO:
  description: A doubled no, waving off a misunderstanding ("no, no, that's not it").
  triggers:
    interjection: ["no, no", "no no", "no, no, no"]
REPLY_TO_THANKS:
  description: Answering thanks or an apology (it's fine, no trouble); not reassurance before a warning ("don't
    worry, it won't explode").
  triggers:
    interjection: ["you're welcome", "no problem", "no problem at all", "not a problem", "no trouble",
                   "it's no trouble", "that's fine", "that's okay", "it's fine", "it's all good", "all good"]
FAIR_AMOUNT:
  description: A sizeable amount, often of money (a fair amount of work, a lot of money).
  triggers:
    # noun phrases only: not the adverb "quite a lot" ("I travel quite a lot")
    np: ["a fair amount", "a sizeable amount", "a hefty sum", "a tidy sum", "a lot of money"]

