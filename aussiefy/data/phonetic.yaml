# Phonetic respellings ("drawl"), applied in order to the final text. Each occurrence rolls
# against prob x the level profile's `phonetic` multiplier. `match` is a Python regex
# (case-insensitive via (?i)); `replace` may use group references.
#
# Contractions come first (min_level 4) so the later rules see "you're", "can't" and so on.

# --- contractions: level 4 starts to drawl, level 5 drawls everything ----------
- id: cannot-cant
  match: "(?i)\\bcan ?not\\b"
  replace: "can't"
  prob: 1.0
  min_level: 4
- id: will-not-wont
  match: "(?i)\\b(?:will|shall) not\\b"
  replace: "won't"
  prob: 1.0
  min_level: 4
- id: do-not-dont
  match: "(?i)\\bdo not\\b"
  replace: "don't"
  prob: 1.0
  min_level: 4
- id: does-did-not
  match: "(?i)\\b(does|did|is|are|was|were|could|would|should|have|has|had) not\\b"
  replace: "\\1n't"
  prob: 1.0
  min_level: 4
- id: pronoun-be
  match: "(?i)\\b(it|that|there|here|what|who|he|she) is\\b(?!\\s*(?:[.,;:!?)\"\u201d\u2014-]))"   # not at a clause end ("This it is."); no "$": rules run on fragments
  replace: "\\1's"
  # A fronted predicate keeps its stressed verb: "how hard it is to follow", not "how hard it's to follow".
  unless_before: &fronted_be "(?i)\\b(?:how(?:\\s+[a-z'-]+){0,5}|(?:where|who|what)(?:\\s+[a-z'-]+){0,4}|as(?:\\s+[a-z'-]+){1,4}\\s+as|than)\\s+$"
  prob: 1.0
  min_level: 4
- id: pronoun-are
  match: "(?i)\\b(we|they|you) are\\b(?!\\s*(?:[.,;:!?)\"\u201d\u2014-]))"
  replace: "\\1're"
  unless_before: *fronted_be
  prob: 1.0
  min_level: 4
- id: i-am
  match: "\\bI am\\b(?!\\s*(?:[.,;:!?)\"\u201d\u2014-]))"
  replace: "I'm"
  unless_before: *fronted_be
  prob: 1.0
  min_level: 4
- id: pronoun-have
  match: "(?i)\\b(I|we|they|you) have(?= (?:been|got|come|done|gone|seen|had|made|given|taken|\\w+ed)\\b)"
  replace: "\\1've"
  prob: 1.0
  min_level: 4
- id: noun-has-been
  match: "(?i)\\b(\\w+) has (?=(?:been|got|gone)\\b)"
  replace: "\\1's "
  prob: 1.0
  min_level: 4
- id: shall-will-ll
  match: "(?i)\\b(I|we|they|you|he|she|it|this \\w+|that \\w+) (?:shall|will)\\b(?! not)"
  replace: "\\1'll"
  prob: 1.0
  min_level: 4
- id: shall-will
  match: "(?i)\\bshall\\b"
  replace: "will"
  prob: 0.9
  min_level: 5

# --- drawl ---------------------------------------------------------------------
- id: dont-know-dunno
  match: "(?i)\\b(?:don't|do not) know\\b"
  replace: "dunno"
  reads_as: do not know
  prob: 0.7
  min_level: 5
- id: because-cause
  match: "(?i)\\bbecause\\b"
  replace: "'cause"
  reads_as: because
  prob: 0.7
  min_level: 5
- id: probably-probly
  match: "(?i)\\bprobably\\b"
  replace: "prob'ly"
  reads_as: probably
  prob: 0.7
  min_level: 5
- id: alright-orright
  match: "(?i)\\b(?:all right|alright)\\b"
  replace: "orright"
  reads_as: alright
  prob: 0.6
  min_level: 5
- id: australia-straya
  match: "\\bAustralia\\b"
  replace: "Straya"
  reads_as: australia
  prob: 0.7
  min_level: 5
- id: something-nothing
  match: "(?i)\\b(some|no|any|every)thing\\b"
  replace: "\\1thin'"
  prob: 0.6
  min_level: 5
- id: a-lot-of-lotta
  match: "(?i)\\ba lot of\\b"
  replace: "a lotta"
  reads_as: a lot of
  prob: 0.6
  min_level: 5

# --- respellings ----------------------------------------------------------------
- id: youre-yer
  match: "(?i)\\byou['’]re\\b"
  replace: "yer"
  reads_as: your
  prob: 0.9
  min_level: 5
- id: your-yer
  match: "(?i)\\byour\\b"
  replace: "yer"
  reads_as: your
  prob: 0.9
  min_level: 5
  dialogue_prob: 1.0
- id: yourself-yerself
  match: "(?i)\\byourself\\b"
  replace: "yerself"
  reads_as: yourself
  prob: 0.8
  min_level: 5
- id: you-ya
  match: "(?i)\\byou\\b(?!['’])"
  replace: "ya"
  reads_as: you
  prob: 0.75
  min_level: 5
  dialogue_prob: 0.95
- id: going-to-gonna
  match: "(?i)\\bgoing to\\b(?= (?!(?:the|a|an|my|your|his|her|our|their|this|that|bed|work|school|church|town|uni|be)\\b)[a-z])"
  replace: "gonna"
  reads_as: going to
  prob: 0.8
  min_level: 5
- id: want-to-wanna
  match: "(?i)\\bwant to\\b"
  replace: "wanna"
  reads_as: want to
  prob: 0.6
  min_level: 5
- id: got-to-gotta
  match: "(?i)\\bgot to\\b"
  replace: "gotta"
  reads_as: got to
  prob: 0.6
  min_level: 5
- id: and-n
  match: "(?<=[A-Za-z])\\s+and\\s+(?=[a-z])"
  replace: "'n "
  reads_as: and
  prob: 0.35
  min_level: 5
  dialogue_prob: 0.5
  notes: "Elided 'and' glued to the previous word: sideways'n call me the pope."
- id: have-ave
  match: "(?i)\\bhave\\b(?! to\\b)"
  replace: "'ave"
  reads_as: have
  prob: 0.4
  min_level: 5
- id: them-em
  match: "(?i)\\bthem\\b"
  replace: "'em"
  reads_as: them
  prob: 0.5
  min_level: 5
  dialogue_prob: 0.8
- id: isnt-aint
  match: "(?i)\\b(?:isn['’]t|aren['’]t)\\b"
  replace: "ain't"
  prob: 0.0              # reads American in narration; only in broad speech, and rarely
  dialogue_prob: 0.15
  min_level: 5
- id: my-me
  match: "(?i)\\bmy\\b(?! oath)"
  replace: "me"
  reads_as: my
  prob: 0.35
  min_level: 5
  dialogue_prob: 0.85
- id: ing-in
  match: "(?i)\\b(?!(?:thing|nothing|something|anything|everything|king|ring|sing|bring|spring|string|wing|sling|sting|swing|ceiling|morning|evening|during)\\b)([a-z]{3,})ing\\b"
  replace: "\\1in'"
  prob: 0.35
  min_level: 5
  dialogue_prob: 0.75
- id: kind-of-kinda
  match: "(?i)\\bkind of\\b"
  replace: "kinda"
  reads_as: kind of
  prob: 0.6
  min_level: 5
- id: out-of-outta
  match: "(?i)\\bout of\\b"
  replace: "outta"
  reads_as: out of
  prob: 0.4
  min_level: 5

# --- Australian spelling: applies at every level, not scaled by drawl ------------
- id: spell-our
  kind: spelling
  match: "\\b(hon|col|fav|flav|harb|hum|neighb|behavi|rum|vap|vig|arm|od|endeav|lab)or(s|ed|ing|able|ite|ites|hood|ful)?\\b"
  replace: "\\1our\\2"
  prob: 1.0
  min_level: 1
  notes: Lower-case only, so the Australian Labor Party keeps its American spelling.
- id: spell-re
  kind: spelling
  match: "\\b(cent|theat|fib|lit|calib|somb|spect)er(s)?\\b"
  replace: "\\1re\\2"
  prob: 1.0
  min_level: 1
- id: spell-metre
  kind: spelling
  # a measure is a metre: a kilometre, centimetre ..., and a plain "meter" after a quantity ("5 meters", "the
  # 100-meter sprint", "twenty meters", "hundreds of meters", "a meter long", "per meter", "square meters"). A
  # device is a meter in Australia too ("if the meter changes", "a gas meter", "install a meter", "a meter
  # reader"). One rule, so a text's American spelling counts it once (dialect.text_english).
  match: "(?<!install a )(?<!Install a )(?<!check a )(?<!Check a )(?<!read a )(?<!Read a )(?<!replace a )(?<!Replace a )(?<!fit a )(?<!Fit a )(?<!fix a )(?<!Fix a )(?<!test a )(?<!Test a )(?<!use a )(?<!Use a )((?:\\b(?:kilo|centi|milli|micro|nano))|(?:(?<=\\d)|(?<=\\d )|(?<=\\d-)|(?<=\\ba )|(?<=\\bA )|(?<=\\bone )|(?<=\\btwo )|(?<=\\bthree )|(?<=\\bfour )|(?<=\\bfive )|(?<=\\bsix )|(?<=\\bseven )|(?<=\\beight )|(?<=\\bnine )|(?<=\\bten )|(?<=\\beleven )|(?<=\\btwelve )|(?<=\\btwenty )|(?<=\\bthirty )|(?<=\\bforty )|(?<=\\bfifty )|(?<=\\bsixty )|(?<=\\bseventy )|(?<=\\beighty )|(?<=\\bninety )|(?<=\\bhundred )|(?<=\\bthousand )|(?<=\\bfew )|(?<=\\bseveral )|(?<=\\bdozen )|(?<=\\bhalf )|(?<=\\bof )|(?<=\\bper )|(?<=\\bsquare )|(?<=\\bcubic )))meter(s)?\\b(?!\\s+(?:reader|readers|reading|readings|box|boxes|maid|maids))"
  replace: "\\1metre\\2"
  prob: 1.0
  min_level: 1
- id: spell-ise
  kind: spelling
  match: "\\b(organ|real|recogn|apolog|critic|emphas|minim|maxim|prior|summar|categor|characteris|util|special|civil|modern|memor|sympath|author|final|standard|optim|visual|mobil|central|normal)iz(e|es|ed|ing|ation|ations)\\b"
  replace: "\\1is\\2"
  prob: 1.0
  min_level: 1
- id: spell-yse
  kind: spelling
  match: "\\b(anal|paral|catal)yz(e|es|ed|ing)\\b"
  replace: "\\1ys\\2"
  prob: 1.0
  min_level: 1
- id: spell-gray
