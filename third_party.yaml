components:
- id: minilm-static-model
  name: aussie-static embedding model
  paths:
  - aussiefy/data/model/vectors.f16
  - aussiefy/data/model/vocab.txt
  licence: Apache-2.0
  upstream:
  - name: sentence-transformers/all-MiniLM-L6-v2
    url: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/tree/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    licence: Apache-2.0
    copyright: Upstream contributors; no separate NOTICE file identified in the 2026-10-13 audit
  - name: nreimers/MiniLM-L6-H384-uncased
    url: https://huggingface.co/nreimers/MiniLM-L6-H384-uncased
    licence: MIT
    copyright: Upstream contributors
  - name: microsoft/MiniLM-L12-H384-uncased
    url: https://huggingface.co/microsoft/MiniLM-L12-H384-uncased
    licence: MIT
    copyright: Copyright (c) Microsoft Corporation
  - name: Google BERT uncased WordPiece vocabulary, via all-MiniLM-L6-v2
    url: https://github.com/google-research/bert
    licence: Apache-2.0
    copyright: Copyright 2018 The Google AI Language Team Authors
  modifications: 'The base model was fine-tuned on pairs from aussiefy''s own slang dictionary, distilled
    with Model2Vec into 256-dimensional static vectors, tuned again on the same pairs and exported as
    float16 rows. The recipe is in training/recipe.yaml and the process in training/README.md.


    In vocab.txt, the [unused*] tokens and [CLS], [SEP] and [MASK] were removed; dictionary slang words
    and contracted forms were added as whole tokens.'
  binds:
    file: aussiefy/data/model/meta.json
    expect:
      name: aussie-static
      version: 1.2.0
      recipe.base.model: sentence-transformers/all-MiniLM-L6-v2
      recipe.base.revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
- id: english-pos-tagger
  name: NLTK/TextBlob averaged-perceptron English tagger
  paths:
  - aussiefy/pos.py
  - aussiefy/data/pos/tagger.json.gz
  - aussiefy/data/pos/README.md
  licence: MIT
  upstream:
  - name: textblob-aptagger
    url: https://github.com/sloria/textblob-aptagger
    licence: MIT
    copyright: Copyright 2013 Matthew Honnibal
  - name: NLTK averaged-perceptron English tagger
    url: https://www.nltk.org/_modules/nltk/tag/perceptron.html
    licence: MIT
    copyright: NLTK modifications Copyright 2015 The NLTK Project
  modifications: Inference is re-implemented without NLTK. Three upstream JSON files are combined, nonzero
    weights rounded to three decimals, and gzipped with a fixed timestamp; scripts/build_pos.py verifies
    the pinned archive checksum.
  binds:
    file: aussiefy/data/pos/meta.json
    expect:
      name: averaged-perceptron-english
      version: nltk-data-2026-10-12
      source_sha256: 6025f530624335c67d6547d44757b357b4e79bae030a0383e9887a92c1718f0b
  digests:
    aussiefy/data/pos/tagger.json.gz: 3222c88544fbc2600def0686055843f9dccc3f60d485c4b791339ea8af2627f6
credits:
- name: WordNet 3.0
  copyright: WordNet 3.0 Copyright 2006 by Princeton University. All rights reserved.
  url: https://wordnet.princeton.edu/license-and-commercial-use
  binds:
    file: aussiefy/data/model/meta.json
    expect:
      wordnet: WordNet 3.0
