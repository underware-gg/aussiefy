- input: 'Once upon a time, there was a little girl called Goldilocks. One morning she went for a walk in the woods.
    She walked for a long time, and soon she was very tired and very hungry.


    After a while she came upon a small house in the middle of the forest. She knocked on the door, but nobody answered.
    So she opened the door and went inside.


    On the kitchen table there were three bowls of porridge. Goldilocks was very hungry, so she decided to try some.


    She tasted the porridge in the first bowl. "This porridge is too hot!" she said.


    She tasted the porridge in the second bowl. "This porridge is too cold!" she said.


    Then she tasted the porridge in the third bowl. "This porridge is just right!" she said happily, and she ate
    it all up.


    After she had eaten, she wanted to sit down. In the living room there were three chairs. She sat in the first
    chair. "This chair is too big!" she said. She sat in the second chair. "This chair is too hard!" she said. Then
    she sat in the third chair. "This chair is just right!" she said. But as soon as she settled down, the chair
    broke into pieces, and she fell on the floor.


    By now Goldilocks was very tired, so she went upstairs to the bedroom. There were three beds. She lay down on
    the first bed, but it was too hard. She lay down on the second bed, but it was too soft. Then she lay down on
    the third bed, and it was just right. She pulled up the blanket and fell fast asleep.


    Soon the three bears came home from their walk.


    "Someone has been eating my porridge!" said Father Bear in his great big voice.


    "Someone has been eating my porridge!" said Mother Bear.


    "Someone has been eating my porridge, and they ate it all up!" cried Baby Bear.


    The bears went into the living room.


    "Someone has been sitting in my chair!" said Father Bear angrily.


    "Someone has been sitting in my chair!" said Mother Bear.


    "Someone has been sitting in my chair, and they broke it into pieces!" cried Baby Bear.


    The bears were very angry now. They went upstairs to the bedroom.


    "Someone has been sleeping in my bed!" said Father Bear.


    "Someone has been sleeping in my bed!" said Mother Bear.


    "Someone has been sleeping in my bed, and she is still here!" cried Baby Bear.


    Just then Goldilocks woke up. She saw the three bears standing over her and she was terrified. "Help!" she screamed.
    She jumped out of the bed, ran down the stairs, and ran out of the house as fast as she could. She did not even
    stop to put on her shoes.


    Goldilocks never went back to that house in the woods again.

    '
