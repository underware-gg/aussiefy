- input: 'Once upon a time a little girl called Goldilocks went for a walk in the woods. She was tired and very
    hungry, and she found a small house. Nobody was home, so she went inside. On the table there were three bowls
    of porridge. The first bowl was too hot. The second bowl was too cold. The third bowl was just right, so she
    ate it all up. Then she sat in the little chair, but it was broken. She was exhausted, so she went upstairs
    and fell asleep in the smallest bed. When the three bears came home, Father Bear was furious. "Someone has been
    eating my porridge!" he said. Mother Bear was very upset. Baby Bear cried, "Someone has been sleeping in my
    bed, and she is still there!" Goldilocks woke up, screamed, and ran away as fast as she could. She never came
    back.

