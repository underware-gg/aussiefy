      a bloody beautiful pattern, what brilliant colours! I shall tell the emperor that I like the cloth heaps."


      "We''re grinning like a shot fox to hear that," said the two weavers, and described to him the colours and
      explained the curious pattern. Well, the old minister listened attentively, that he might relate to the emperor
      what they said; and so he did.


      Now the swindlers asked for more the folding stuff, silk and gold-cloth, which they required for weaving.
      Anyway, they kept everything for themselves, and not a thread came near the loom, but they continued, as hitherto,
      to work at the empty looms.


      Soon afterwards the emperor sent another honest courtier to the weavers to see how they were getting on, and
      if the cloth was nearly finished. Now, like the old minister, he looked and looked but could see nothing,
      as there was nothing to be seen.


      "Is it not a beautiful piece of cloth?" asked the two swindlers, showing and explaining the magnificent pattern,
      which, however, didn''t exist.


      "I am not bloody stupid," said the bloke. "It''s therefore my good appointment for which I''m not fit. It
      is bloody strange, but I must not let any one know it;" and he praised the cloth, which he did not see, and
      expressed his joy at the beautiful colours and the fine pattern. "It''s the duck''s nuts," he said to the
      emperor.


      Every bastard in the whole town talked about the precious cloth. At last the emperor wished to see it himself,
      while it was still on the loom. With a number of courtiers, including the two who had already been there,
      he went to the two clever swindlers, who now worked as hard as they could, but without using any thread.


      "Is it not magnificent?" said the two old pollies who had been there before. "Your Majesty must admire the
      colours and the pattern." And then they pointed to the empty looms, for they imagined the others could see
      the cloth.


      "What''s this?" reckoned the emperor, "I don''t see anything at all. That is crook! Am I not the full quid?
      Am I unfit to be emperor? That would indeed be the most dreadful thing that could happen to me."


      "Fair dinkum," he said, turning to the weavers, "your cloth has our most gracious approval;" and nodding contentedly
      he looked at the empty loom, for he did not like to say that he saw nothing. All his attendants, who were
      with him, looked and looked, and although they could not see anything more than the others, they said, like
      the emperor, "It''s dead beautiful." And all advised him to wear the brand-spankin''-new magnificent clothes
      at a great procession which was soon to take place. "It''s magnificent, beautiful, beaut," one heard them
      say; every man and his dog seemed to be rapt, and the emperor appointed the two swindlers "Imperial Court
      weavers."


      The whole night previous to the day on which the procession was to take place, the swindlers pretended to
      work, and burned more than sixteen candles. People should see that they were flat out like a lizard drinking
      to finish the emperor''s brand-spankin''-new suit. They pretended to take the cloth from the loom, and worked
      about in the air with big scissors, and sewed with needles without thread, and said at last: "The emperor''s
      brand-spankin''-new suit is ready now."


      The emperor and all his barons then came to the hall; the swindlers held their arms up as if they held something
      in their mitts and said: "These are the strides!" "This is the coat!" and "Here is the cloak!" and so on.
      "They''re all as light as a cobweb, and one must feel as if one had nothing at all upon the body; but that
      is just the beauty of them."


      "Indeed!" said all the courtiers; but they could not see anything, for there was nothing to be seen.


      "Does it please your Majesty now to graciously undress," said the swindlers, "that we may assist your Majesty
      in putting on the brand-spankin''-new suit before the large looking-glass?"


      The emperor undressed, and the swindlers pretended to put the brand-spankin''-new suit upon him, one piece
      after another; and the emperor looked at himself in the glass from every side.


      "How well they look! How well they fit!" said all. "What a beautiful pattern! What fine colours! That is a
      magnificent suit of clothes!"


      The master of the ceremonies announced that the bearers of the canopy, which was to be carried in the procession,
      were ready.


      "I''m ready," said the emperor. "Doesn''t my suit fit me marvellously?" Then he turned once more to the looking-glass,
      that people should think he admired his garments.


      The chamberlains, who were to carry the train, stretched their hands to the ground as if they lifted up a
      train, and pretended to hold something in their mitts; they did not like people to know that they couldn''t
      see anything.


      The emperor marched in the procession under the beautiful canopy, and all who saw him in the street and out
      of the windows exclaimed: "Indeed, the emperor''s brand-spankin''-new suit is incomparable! What a long train
      he has! How well it fits him!" Nobody wished to let others know he saw nothing, for then he would have been
      unfit for his office or thick as two short planks. Never emperor''s clothes were more admired.


      "But he has nothing on at all," said a little child at last. "Bugger me! listen to the voice of an innocent
      littlie," said the old fella, and one whispered to the other what the nipper had said. "But he has nothing
      on at all," cried at last the whole people. That made a deep impression upon the emperor, for it seemed to
      him that they were right; but he reckoned to himself, "Now I must bear up to the end." And the chamberlains
      walked with still greater dignity, as if they carried the train which didn''t bloody well exist.

