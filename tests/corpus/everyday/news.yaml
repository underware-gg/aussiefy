    age.

- file: news/ford_square_dance_1925.txt
  title: Ford Hires Big Hall for Old-Time Dance
  genre: news
  register: neutral
  tone: light, whimsical
  url: https://en.wikisource.org/wiki/The_New_York_Times/1925/12/14/Ford_Hires_Big_Hall_for_Old-Time_Dance
  author: The Associated Press, in The New York Times
  licence: public domain (US; published 1925)
  licence_evidence: >-
    Wikisource transcription of The New York Times for December 14, 1925 (page title "The New York
    Times/1925/12/14/..."; dateline "DETROIT, Dec. 13 (AP)"). The page shows no licence template;
    the status follows from publication in 1925, before 1929, so any US copyright has expired.
  retrieved: 2026-10-12
  words: 277
  excerpt: Whole article, from "DETROIT, Dec. 13 (AP)." to "square dances again popular."
  notes: >-
    Henry Ford's campaign to revive square dancing; "Mellie" Dunham, a famous fiddler of the day,
    and promoter Tex Rickard are public figures. "vaudeville contract", "heed the call of the
    footlights", "barn dance", "Madison Square Garden", US spelling "standardize".

