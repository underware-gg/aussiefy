# Everyday register: NEWS AND PUBLIC INFORMATION (news reports, press releases, weather
# forecasts, public notices, sports reports, community news, obituaries of public figures).
# Source texts for testing the translator; every file here is in the public domain (US federal
# government work, or published before 1929) or under a Creative Commons Attribution licence.
#
# words: whitespace-split count of the saved file (Python str.split).
# Texts are verbatim, curly quotes and dashes kept as published. Changes are whitespace only (one
# blank line between blocks, no hard wrapping), plus removal of page furniture (nav, share buttons,
# bylines, source lists, contact blocks, agency boilerplate), noted per item.
# Copyrighted or unclear full texts are local only: see news-remote.yaml.
# Kieran has file: null here pending Australian redistribution review.

- file: news/nashville_kurdish_community_anniversary.txt
  title: Nashville honors 50 Years of Kurdish community in the United States
  genre: community-news
  register: neutral
  tone: warm, civic, matter-of-fact
  url: https://www.voanews.com/a/nashville-honors-50-years-of-kurdish-community-in-the-united-states/8209670.html
  author: Najab Balay, Voice of America (translated from VOA Kurdi)
  licence: public domain (US federal government work, Voice of America)
  licence_evidence: >-
    https://www.voanews.com/p/5338.html (VOA terms of use): "All text, audio and video material
    produced exclusively by the Voice of America is in the public domain." The story is VOA's own
    (byline Najab Balay; "translated from the original VOA Kurdi article"); no wire credit.
  retrieved: 2026-10-12
  words: 212
  excerpt: >-
    Whole article body, from "The Metropolitan Council of Nashville" to "signed on October 6,
    2026." Omits the headline, byline and the editor's note about translation.
  notes: >-
    Short local-government news item: "Metropolitan Council", "council member ... District 4",
    "proclamation", "southeastern U.S. state of Tennessee". Credit VOA when reused.

- file: news/boston_area_forecast_discussion.txt
  title: Area Forecast Discussion, NWS Boston/Norton MA, 252 PM EDT Mon Oct 12 2026
  genre: weather
  register: formal
  tone: dry, technical, with a flash of forecaster humour ("the 'S word' just yet (snow)")
  url: https://forecast.weather.gov/product.php?site=NWS&issuedby=BOX&product=AFD&format=txt&version=1&glossary=0
  author: National Weather Service, Boston/Norton MA forecast office (NOAA)
  licence: public domain (US federal government work)
  licence_evidence: >-
    https://www.weather.gov/disclaimer: "The information on National Weather Service (NWS) Web
    pages are in the public domain, unless specifically noted otherwise, and may be used without
    charge for any lawful purpose".
  retrieved: 2026-10-12
  words: 637
  excerpt: >-
    The .DISCUSSION section's KEY MESSAGE 2 and KEY MESSAGE 3, from "KEY MESSAGE 2...Isolated
    shower possible Wednesday" to "may drop into the upper 20s." Omits the header, "What has
    changed", the key-message list, KEY MESSAGE 1, and the aviation and marine sections.
  notes: >-
    The product URL always serves the latest issuance, so it will have moved on; the issuance used
    here is archived at https://mesonet.agron.iastate.edu/wx/afos/p.php?pil=AFDBOX&e=202610121852
    (checked). The 69-column hard wrapping was joined into paragraphs (whitespace only). Kept as
    issued: "mph", Fahrenheit highs ("in the 70s"), "fall", "925mb temperatures +17- 18C", NWS
    shorthand (LLJ, CAA, RH, ECMWF, GFS), "0.60\"" for inches, and the backtick apostrophes
    ("won`t", "can`t", "It`s") that NWS text products use.

- file: news/yellowstone_fishing_restrictions_lifted.txt
  title: 'Update: Yellowstone lifts remaining fishing restrictions for Firehole, Madison and Gibbon rivers'
  genre: notice
  register: formal
  tone: dry, official, with a polite request to anglers at the end
  url: https://www.nps.gov/yell/learn/news/26015.htm
  author: Yellowstone National Park, National Park Service (US Department of the Interior)
  licence: public domain (US federal government work)
  licence_evidence: >-
    https://www.nps.gov/aboutus/disclaimer.htm: "material created by the National Park Service and
    presented on this website, unless otherwise indicated, is generally considered in the public
    domain." No other notice on the page.
  retrieved: 2026-10-12
  words: 375
  excerpt: >-
    The two most recent updates on the page: the Sept. 4 update (from "MAMMOTH HOT SPRINGS, Wyo. –
    Effective Friday, Sept. 4") and the Aug. 28 update with its two headings, ending "if
    conditions worsen." Omits the earlier July and August updates further down the page.
  notes: >-
    Park-notice prose: "anglers", "tributaries", "68 degrees Fahrenheit (20 degrees Celsius)",
    "2 p.m. to sunrise", "Do not play hooked trout to exhaustion." US date style ("Sept. 4",
    "Aug. 28").

