- file: news/santa_fe_christmas_tree_permits.txt
  title: Christmas tree permits available from the Santa Fe National Forest for the upcoming holiday season
  genre: notice
  register: neutral
  tone: helpful, practical, seasonal
  url: https://www.fs.usda.gov/r03/santafe/newsroom/releases/christmas-tree-permits-available-santa-fe-national-forest-upcoming
  author: Santa Fe National Forest, USDA Forest Service
  licence: public domain (US federal government work, 17 U.S.C. 105)
  licence_evidence: >-
    Official USDA Forest Service news release on fs.usda.gov ("An official website of the United
    States government"), no copyright notice on the page. The USDA site policy page
    (https://www.usda.gov/policies-and-links) refused our fetch (403); a search snippet of it reads
    that most of the USDA site is public domain and may be freely copied. Status rests on 17 U.S.C.
    105 (works of federal employees).
  retrieved: 2026-10-12
  words: 339
  excerpt: >-
    From "Christmas tree permits will be available to purchase online" to "provide forage for
    wildlife." Omits the headline and subhead, the "For more information" list of link titles, the
    "About the Forest Service" boilerplate and the equal-opportunity line.
  notes: >-
    Everyday public notice: "Fourth graders", "Every Kid Outdoors pass", "5 inches in diameter and
    10 feet in height", "a 15-foot tree", "$10", "district offices", "Recreation.gov". The page's
    own slip "December 20, 2024" (for 2025) is kept verbatim.

