# The Interfold docs (https://docs.theinterfold.com/) as an everyday-English test source: MDX pages with code,
# components, tables and maths, fetched verbatim from the public docs repo at a pinned commit.
# Rebuild or update with:  aussiefy dev ingest tests/corpus/everyday/interfold.yaml [--force] [--ref main]
#
# words: whitespace-split count of the whole saved file (frontmatter, imports, JSX and code included).
# has_code: true when the file has a fenced code block or inline `code`; notes say which.

out: interfold
defaults:
  repo: theinterfold/interfold
  ref: f5cb26d94c1dde6dede421b48089d37eeb422057   # main, 2026-10-12

licence:
  permission: >-
    The founder gave permission to ingest these docs into this repo as a test source (relayed by the
    project owner, 2026-10-12). The pages stay under the docs' own licence (below) and keep its notice.
  summary: >-
    The docs source is in a public repo whose root licence is GNU LGPL v3. The docs README applies that
    licence to the documentation. The live site shows only a copyright line, with no licence. There is
    no separate content licence (e.g. CC BY) for the prose anywhere.
  spdx: LGPL-3.0-or-later   # as the READMEs state; code-file headers say LGPL-3.0-only (see evidence)
  site_footer: "2026 © The Interfold"   # rendered by docs/components/Footer/index.tsx as `{new Date().getFullYear()} © The Interfold`
  evidence:
    - where: https://docs.theinterfold.com/ (footer, every page)
      text: "2026 © The Interfold"
    - where: LICENSE.md (repo root)
      text: "GNU LESSER GENERAL PUBLIC LICENSE Version 3, 29 June 2007"
    - where: README.md (repo root), "## License"
      text: "This repo created under the [LGPL-3.0+ license](LICENSE.md)."
    - where: docs/README.md, "## License"
      text: "This documentation is created under the [LGPL-3.0+ license](../LICENSE.md)."
    - where: docs/theme.config.jsx, docs/components/Footer/index.tsx (first line)
      text: "// SPDX-License-Identifier: LGPL-3.0-only"
    - where: scripts/check-license-headers.sh
      text: "SPDX headers are enforced only on *.js *.jsx *.nr *.rs *.sol *.ts *.tsx; the .mdx pages carry no header."
    - where: docs/pages/tokenomics.mdx
      text: "... LGPLv3 license. A portion of supply is allocated to The Interfold Foundation. ..."
    - where: https://docs.theinterfold.com/robots.txt
      text: "# Allow every crawler and AI agent to read the docs. ... User-agent: * / Allow: /"
  caveats: >-
    LGPL is a software licence; it permits copying and modifying, with conditions (keep the notice, release
    modified versions under the same licence). Applying it to prose is unusual, and "-or-later" (READMEs) and
    "-only" (SPDX headers) disagree. robots.txt allows crawling, but that is not a licence; the founder's
    permission (above) is what lets the pages be committed.

generator:
  name: Nextra 2 (nextra-theme-docs) on Next.js 14
  evidence: >-
    docs/package.json depends on nextra ^2.13.4, nextra-theme-docs ^2.13.4, next ^14.2.1. The HTML uses
    nextra-* / nx-* classes and /_next/static/ chunks. Hosted on Vercel behind Cloudflare (x-vercel-* headers).
    Sitemap is generated by docs/scripts/generate-sitemap.mjs; llms.txt is hand-written.

source_repo:
  url: https://github.com/theinterfold/interfold
  docs_path: docs/pages   # one .mdx per page; sidebar order and titles in _meta.json files per folder
  licence: LGPL-3.0 (LICENSE.md)
  drift: >-
    The live site matched this commit for 14 of the 15 pages (spot check of prose paragraphs, 2026-10-12).
    build/quick-start differs: the live "what happened" recap after the demo has older wording than main.

site_map:
  sitemap: https://docs.theinterfold.com/sitemap.xml   # 57 URLs
  llms_txt: https://docs.theinterfold.com/llms.txt     # entry points only, links to the sitemap
  sections: [Learn, Build, Run a Ciphernode, CRISP, Protocol Internals, Reference, FOLD & Governance, Archive (whitepaper)]

items:
  - name: home
    path: docs/pages/index.mdx
    title: The Interfold
    url: https://docs.theinterfold.com/
    kind: landing
    words: 591
    has_code: false
    notes: >-
      Landing page that is almost all JSX: <Hero>, <SectionHead>, <LinkCards>/<LinkCard>, <Stats>, <Terminal>,
      <ThresholdRing>. The prose is in string props (lead='...', sub: '...') and between component tags.
      Tests that a translator can find prose inside components without breaking their attributes.
  - name: learn
    path: docs/pages/learn/index.mdx
    title: What is the Interfold?
    url: https://docs.theinterfold.com/learn
    kind: overview
    words: 1223
    has_code: true
    notes: Plain explanatory prose with 2 tables and 1 <Callout type='info'>. Inline code only (26 spans).
  - name: learn_what_is_e3
    path: docs/pages/learn/what-is-e3.mdx
    title: What is an E3?
    url: https://docs.theinterfold.com/learn/what-is-e3
    kind: concept
    words: 1299
    has_code: true
    notes: Concept explainer. A <Flow steps={[{ label, icon, sub }]}> diagram with prose in JS object props, 4 tables, inline code only.
  - name: learn_cryptography
    path: docs/pages/learn/cryptography.mdx
    title: Cryptography
    url: https://docs.theinterfold.com/learn/cryptography
    kind: concept
    words: 2309
    has_code: true
    notes: >-
      Dense technical concept page with KaTeX maths: inline $R_q = \mathbb{Z}_q[X]/(X^d + 1)$ and display $$ ... $$
      blocks, 7 tables, <ThresholdRing>. The maths must pass through untouched.
  - name: learn_use_cases
    path: docs/pages/learn/use-cases.mdx
    title: Use Cases
    url: https://docs.theinterfold.com/learn/use-cases
    kind: concept
    words: 769
    has_code: true
    notes: Short, plain prose with bullet lists and 1 table. Good easy baseline. 4 inline code spans.
  - name: build_quick_start
    path: docs/pages/build/quick-start.mdx
    title: Quick Start
    url: https://docs.theinterfold.com/build/quick-start
    kind: quickstart
    words: 1777
    has_code: true
    notes: >-
      <Steps> wrapping ### headings, 6 fenced blocks (bash, text), 3 <Callout>s (warning: "This private key is
      public..."), 5 tables, <Lifecycle>/<Stage>. Live site wording differs slightly from this source (see drift).
  - name: build_installation
    path: docs/pages/build/installation.mdx
    title: Installation
    url: https://docs.theinterfold.com/build/installation
    kind: how-to
    words: 1540
    has_code: true
    notes: >-
      <Tabs items={['interfoldup', 'Release archive', 'From source']}> with <Tabs.Tab> panes, each holding a
      <Steps> block; 12 fenced bash blocks, 3 callouts, 5 tables. The tab labels are a JS array of strings.
  - name: build_hello_world
    path: docs/pages/build/hello-world.mdx
    title: Hello World
    url: https://docs.theinterfold.com/build/hello-world
    kind: tutorial
    words: 1281
    has_code: true
    notes: Tutorial with 10 fenced blocks in four languages (bash, rust, ts, tsx), <Steps>, <Flow>, 2 callouts. Code comments are in English.
  - name: build_tutorials_encrypt_and_submit
    path: docs/pages/build/tutorials/encrypt-and-submit.mdx
    title: Encrypt and Submit an Input
    url: https://docs.theinterfold.com/build/tutorials/encrypt-and-submit
    kind: tutorial
    words: 1500
    has_code: true
    notes: 8 fenced TypeScript blocks, so the page has 14 `import` lines, most of them inside code fences rather than MDX imports. <Steps>, 1 callout.
  - name: operate_troubleshooting
    path: docs/pages/operate/troubleshooting.mdx
    title: Troubleshooting
    url: https://docs.theinterfold.com/operate/troubleshooting
    kind: troubleshooting
    words: 3218
    has_code: true
    notes: Symptom / cause / fix structure for node operators. 7 tables quoting log messages in inline code, 3 fenced blocks (bash, text), <Steps>.
  - name: reference_glossary
    path: docs/pages/reference/glossary.mdx
    title: Glossary
    url: https://docs.theinterfold.com/reference/glossary
    kind: reference
    words: 2067
    has_code: true
    notes: >-
      A to Z definitions under ## letter headings, an anchor-link index line ([A](#a) · [B](#b) ...), many
      cross-links. No fences; 80 inline code spans. Heading text drives anchors, so headings must not be translated if links are to keep working.
  - name: reference_configuration
    path: docs/pages/reference/configuration.mdx
    title: Node Configuration
    url: https://docs.theinterfold.com/reference/configuration
    kind: reference
    words: 3646
    has_code: true
    notes: Config reference. 15 key / type / default / description tables, 5 fenced YAML blocks, 4 callouts, 337 inline code spans. The heaviest leave-it-alone test.
  - name: faq_fold_token
    path: docs/pages/faq/fold-token.mdx
    title: FOLD Token
    url: https://docs.theinterfold.com/faq/fold-token
    kind: faq
    words: 669
    has_code: true
    notes: Question-as-### heading FAQ with **bold lead-ins**. Plain prose; 6 inline code spans.
  - name: faq_auction
    path: docs/pages/faq/auction.mdx
    title: The FOLD Auction
    url: https://docs.theinterfold.com/faq/auction
    kind: faq
    words: 1273
    has_code: true
    notes: FAQ with a key/value table of dates, times and prices (bold inside cells), 3 callouts. Numbers and units must survive.
  - name: constitution
    path: docs/pages/constitution.mdx
    title: The Interfold Constitution
    url: https://docs.theinterfold.com/constitution
    kind: legal
    words: 4518
    has_code: true
    notes: >-
      Distinctive voice: formal charter with a preamble, numbered articles and _italic_ defined terms
      (Constitutional / non-constitutional tracks). No imports or components. 8 inline code spans, no fences.
