# Everyday register: workplace, business and technical source texts kept in everyday/workplace/.
# Every text here is under a licence that lets us redistribute it (public domain, CC0, CC BY,
# CC BY-SA, MIT, Apache 2.0). Each is a verbatim excerpt from `start` of the source to `end`; only
# whitespace was touched (trailing spaces stripped, runs of blank lines collapsed). Markdown sources
# are kept as Markdown, hard line wraps included. `.txt` files were extracted from HTML with
# aussiefy.scrape.ingest.html_to_text. `words` counts whitespace-separated tokens containing
# a letter or digit, as in classics/manifest.yaml.

