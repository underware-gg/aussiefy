# Everyday register: INSTRUCTIONS AND HOW-TO (recipes, DIY, appliance and product instructions,
# safety and public-health advice, gardening, park and travel guidance, FAQs). Source texts for
# testing the translator; committed files have public-domain or CC BY-SA 4.0 declarations.
# Rockwell has file: null and a remote pointer pending Australian redistribution review.
#
# words: whitespace-split count of the saved file (Python str.split, so no-break spaces count as breaks).
# Texts are verbatim. Changes are whitespace only (one blank line between blocks, no hard wrapping),
# plus removal of page furniture (nav, link lists, image captions, page numbers), noted per item.
# Pre-1929 Gutenberg texts keep their original spelling and punctuation; Gutenberg's "--" became
# U+2014 and its _italic_ markers were dropped (typography only), as in tests/corpus/classics.

- file: instructions/nps_bear_safety.txt
  title: Staying Safe Around Bears
  genre: safety
  register: neutral
  tone: serious, bossy (shouty capitals, "Do NOT ...")
  url: https://www.nps.gov/subjects/bears/safety.htm
  author: National Park Service (US Department of the Interior)
  licence: public domain (US federal government work)
  licence_evidence: >-
    https://www.nps.gov/aboutus/disclaimer.htm: "material created by the National Park Service and
    presented on this website, unless otherwise indicated, is generally considered in the public
    domain." No other notice on the page text.
  retrieved: 2026-10-12
  words: 729
  excerpt: >-
    From "Once a bear has noticed you" (the "Bear Encounters" section) to the end of "Bear Attacks"
    ("do NOT play dead—ﬁght back!"). Omits the opening "What Should I Do" paragraphs and the
    bear-spray section.
  notes: >-
    The page uses the "ﬁ"/"ﬂ" ligature characters (U+FB01, U+FB02) in a few words (wooﬁng, ﬂat,
    ﬂeeing, ﬁght); kept as published. One sentence ("Do not make any loud noises or screams...") is
    repeated in the source; kept.

