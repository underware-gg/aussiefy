- file: week_end_visiting.txt
  title: 'The Tortures of Week-End Visiting (Robert C. Benchley, in Of All Things, 1921)'
  genre: humour essay
  register: casual
  tone: fretful, self-mocking, chatty complaint
  url: https://www.gutenberg.org/ebooks/37660
  author: Robert C. Benchley (1889-1945)
  licence: Public domain
  licence_evidence: >-
    Project Gutenberg eBook #37660, released as public domain in the USA; Henry Holt and Company,
    New York, 1921. Benchley died 1945.
  retrieved: 2026-10-12
  words: 546
  excerpt: 'From "Take, for example, the matter of arising in the morning." to "...almost clandestinely, you proceed to dress."'
  notes: >-
    The nearest public-domain match to chatty blog writing: second person, asides in brackets,
