# Everyday register, group CONVERSATIONAL AND PERSONAL: letters, dialogue and plays, opinionated
# and complaining prose, forum Q&A, casual speeches. Every text here is committable (public domain or
# CC BY-SA); copyrighted pointers, if any, go in conversational-remote.yaml.
#
# Texts are verbatim from the source named in `url`. Only whitespace was touched: printers' line
# wrapping joined into paragraphs, runs of spaces collapsed, leading indentation dropped. Project
# Gutenberg headers, licences, illustration captions ("[Illustration: ...]") and running boilerplate
# were dropped. Spelling, dialect, punctuation, PG's "--" dashes and its _underscore_ italics are kept
# as transcribed. Stack Exchange posts were converted from the post HTML: the question title is the
# first line, a "* * *" row separates the question from the answer, list items are prefixed "- ",
# block quotes "> ", and link targets are dropped (link text kept).
#
# `words` counts whitespace-separated tokens containing a letter or digit.
#
# Public domain: every Project Gutenberg text below was published in the US before 1929, and every
# author died before 1955, so the works are also out of copyright in Australia.

- file: you_know_me_al_letter.txt
  title: 'You Know Me Al: A Busher''s Letters (Ring W. Lardner, 1916), Chapter I, first letter'
  genre: letter
  register: casual
  tone: boastful, naive, chatty; ungrammatical and misspelt by design
  url: https://www.gutenberg.org/ebooks/52670
  author: Ring W. Lardner (1885-1933)
  licence: Public domain
  licence_evidence: >-
    Project Gutenberg eBook #52670, released as public domain in the USA; title page "Copyright, 1916,
    by George H. Doran Company" (stories copyright 1914 by the Curtis Publishing Company), so
    published before 1929. Lardner died 1933.
  retrieved: 2026-10-12
  words: 493
  excerpt: 'Chapter I, "A Busher''s Letters Home": the first letter, Terre Haute, Indiana, September 6, from the dateline to "Your pal, JACK."'
  notes: >-
    A rookie pitcher writing home to his friend Al: dense US vernacular ("I seen", "you could of",
    "don't have no"), baseball slang and deliberate misspellings ("appresiated", "serious" for
    series, "excepted"). Plain-text file https://www.gutenberg.org/cache/epub/52670/pg52670.txt.
    Excerpt checked for slurs: none.

- file: daddy_long_legs_are_you_bald.txt
  title: 'Daddy-Long-Legs (Jean Webster, 1912), the letter of December 19th ("ARE YOU BALD?")'
  genre: letter
  register: casual
  tone: warm, cheeky, exuberant
  url: https://www.gutenberg.org/ebooks/40426
  author: Jean Webster (1876-1916)
  licence: Public domain
  licence_evidence: >-
    Project Gutenberg eBook #40426, released as public domain in the USA; transcribed from the
    Grosset & Dunlap edition, "Copyright, 1912, by The Century Co." Webster died 1916.
  retrieved: 2026-10-12
  words: 703
  excerpt: 'Freshman-year letter dated "December 19th.", from the dateline to "Good-by till January--and a merry Christmas!"'
  notes: >-
    Chose PG #40426 (US edition, American spelling: color, gray, honor, favorite) over the older
    PG #157, which uses British spellings. Curly quotes as in the UTF-8 file. Two "[Illustration]"
    lines dropped, so "Here is your portrait:" now points at a drawing that is not in the text.
    The telegraph options in the postscript ("Mr. Smith is quite bald, or ...") were separate
    lines in print and are joined into one paragraph. Checked for period ethnic terms (the
    November 15th letter has "Gipsy", so it was not used).

- file: self_made_merchant_expense_account.txt
  title: 'Letters from a Self-Made Merchant to His Son (George Horace Lorimer, 1902), Letter II'
  genre: letter
  register: casual
  tone: gruff, scolding, folksy, paternal advice
  url: https://www.gutenberg.org/ebooks/21959
  author: George Horace Lorimer (1867-1937)
  licence: Public domain
  licence_evidence: >-
    Project Gutenberg eBook #21959, released as public domain in the USA; title page "Copyright,
    1901-1902, by The Curtis Publishing Co." and "Copyright, 1902, by Small, Maynard & Company".
    Lorimer died 1937.
  retrieved: 2026-10-12
  words: 757
  excerpt: 'Letter II, "CHICAGO, May 4, 189-", from the dateline to "...my drummers'' bills still show his influence." (about two-thirds of the letter)'
  notes: >-
    A Chicago pork-packer chews out his Harvard son over his expense account: business slang
    ("hump-shouldered", "scalawag steer", "dynamite your way to the front"). Doubles as an advice
    text. Other letters in the book contain racial slurs (Letters I and III among them); this
    excerpt was checked and has none.

- file: exact_science_of_matrimony.txt
  title: 'The Exact Science of Matrimony (O. Henry, in The Gentle Grafter, 1908)'
  genre: dialogue
  register: casual
  tone: sly, boastful, con-man patter
  url: https://www.gutenberg.org/ebooks/1805
  author: O. Henry (William Sydney Porter, 1862-1910)
  licence: Public domain
  licence_evidence: >-
    Project Gutenberg eBook #1805, released as public domain in the USA ("print editions not
    protected by U.S. copyright"); The Gentle Grafter was published 1908. O. Henry died 1910.
  retrieved: 2026-10-12
  words: 688
  excerpt: 'Opening of the story, from "As I have told you before," said Jeff Peters to "...it was a kindness to Zeke''s memory to give her the job."'
  notes: >-
    Jeff Peters telling a yarn about a fake matrimonial agency, with nested quoted dialogue
    ("says I", "says Andy") and the mock newspaper advertisement. Period practice of opening each
    paragraph of a continued quotation with a quote mark kept. The same book's "Jeff Peters as a
    Personal Magnet" was rejected for a "celebrated Indian medicine man" caricature, and "A Tempered
    Wind" for slurs; this story was checked and has none.

- file: jumping_frog_jim_smiley.txt
  title: 'The Notorious Jumping Frog of Calaveras County (Mark Twain, 1865; text of Sketches New and Old, 1875)'
  genre: dialogue
  register: casual
  tone: rambling, deadpan, garrulous tall tale
  url: https://www.gutenberg.org/ebooks/3189
  author: Mark Twain (Samuel L. Clemens, 1835-1910)
  licence: Public domain
  licence_evidence: >-
    Project Gutenberg eBook #3189 (Sketches New and Old, Hartford, 1875), released as public domain
    in the USA. Twain died 1910.
  retrieved: 2026-10-12
  words: 583
  excerpt: 'Simon Wheeler''s monologue, from "Rev. Leonidas W. H''m, Reverend Le--well" to "...as near as you could cipher it down." (Smiley''s betting habit and the fifteen-minute nag)'
  notes: >-
    One long spoken monologue in Western dialect ("warn't", "feller", "thish-yer", "resk"). Twain's
    framing narration before it is left out. The quote marks open each paragraph and are not
    closed, as printed. Stops before the bull-pup paragraph (a dog-fight). Other pieces in the
    book contain slurs; this excerpt has none.

- file: trifles_kitchen.txt
  title: 'Trifles (Susan Glaspell, one-act play, 1916), the kitchen scene'
  genre: play
  register: casual
  tone: terse, wry, quietly indignant; rural Midwest speech
  url: https://www.gutenberg.org/ebooks/10623
  author: Susan Glaspell (1876-1948)
  licence: Public domain
  licence_evidence: >-
    Project Gutenberg eBook #10623 (Glaspell, Plays, Small, Maynard & Co., 1920), released as public
    domain in the USA ("print editions not protected by U.S. copyright"). First performed 1916.
    Glaspell died 1948.
  retrieved: 2026-10-12
  words: 645
  excerpt: 'From "SHERIFF: Nothing here but kitchen things." to Mrs Hale''s "...when she had to come away in such a hurry."'
  notes: >-
    Play-script format (SPEAKER: line) with stage directions in _underscore_ italics as in the PG
    file. The men patronise the women ("Well, can you beat the women!", "women are used to worrying
    over trifles") and the women push back. The play concerns a murder, but this excerpt has no
    violent detail. PG prints "Mr" and "Mrs" without full stops.

