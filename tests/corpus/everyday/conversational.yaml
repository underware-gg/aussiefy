- file: turkey_pardon_2016.txt
  title: 'Remarks by the President at Pardoning of the National Thanksgiving Turkey (Barack Obama, 23 November 2016)'
  genre: speech
  register: casual
  tone: jokey, punny, self-deprecating, then earnest
  url: https://obamawhitehouse.archives.gov/the-press-office/2016/11/23/remarks-president-pardoning-national-thanksgiving-turkey
  author: Barack Obama (White House Office of the Press Secretary transcript)
  licence: Public domain (work of the US federal government, 17 U.S.C. 105)
  licence_evidence: >-
    https://obamawhitehouse.archives.gov/copyright says "Pursuant to federal law,
    government-produced materials appearing on this site are not copyright protected." The
    transcript is an official White House release. (17 U.S.C. 105 covers the US only; other
    countries may treat US government works differently.)
  retrieved: 2026-10-12
  words: 724
  excerpt: 'From "Malia and Sasha, by the way, are thankful" to "...we''re not leaving any room for leftovers. (Laughter.)"'
  notes: >-
    Modern spoken American with the transcript's crowd cues ("(Laughter.)", "AUDIENCE: Ooooh --")
    and spaced "--" dashes. Cut with the repo's html_to_text and excerpt helpers, so curly
    apostrophes became straight (excerpt() normalises them) and the double quotes stay curly.
    Starts after a paragraph that names the President's young nephews. One middle stretch lists
    economic achievements (job creation, health insurance); the rest is turkey puns.

