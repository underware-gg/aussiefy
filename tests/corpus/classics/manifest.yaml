- file: man_from_ironbark.txt
  licence: public-domain
  title: The Man from Ironbark
  author: A. B. "Banjo" Paterson
  author_died: 1941
  first_published: 1892-12-17 (The Bulletin); collected 1895
  source_url: https://archive.org/details/cu31924009183298
  checked_against: https://www.gutenberg.org/ebooks/213
  words: 551
  kind: poem
  notes: >-
    Transcribed from the 1896 printing scan (Wikisource has no scan-backed copy in its edition of the
    collection; its standalone page https://en.wikisource.org/wiki/The_Man_from_Ironbark is a later,
    double-quoted text). Real variant: the 1896 scan (and Wikisource) read "with nail and tooth";
    PG #213 reads "with tooth and nail" - the scan wins. Also from the scan: "barber's wall."
    (PG comma), "cigar;" (PG colon), "newly-shaven", 'tote,'. Printer's slips kept/handled: the scan
    has no closing quote after "pretty green up there in Ironbark." (kept as printed); its final
    "it's tough." closes with a double quote mark, normalised to the single quote it stands for.

- file: mulga_bills_bicycle.txt
  licence: public-domain
  title: Mulga Bill's Bicycle
  author: A. B. "Banjo" Paterson
  author_died: 1941
  first_published: 1896-07-25 (Sydney Mail); collected in Rio Grande's Last Race and Other Verses, 1902
  source_url: https://archive.org/details/cu31924009433230
  checked_against: https://www.gutenberg.org/ebooks/304
  words: 435
  kind: poem
  notes: >-
    Text of the 1902 first edition of Rio Grande's Last Race, proofed against the archive.org scan.
    PG #304 agrees word for word but drops the running quotation marks and prints "HATE" for italic
    "hate". The standalone Wikisource page (https://en.wikisource.org/wiki/Mulga_Bill%27s_Bicycle)
    is a later revised text ("wildcat", "can it swim? ... fight?", a "steak" typo) and the 1921
    Collected Verse (archive.org cu31924009183330) has further authorial revisions ("But Mulga
    Bill", double quotes); neither used.

- file: drovers_wife.txt
  licence: public-domain
  title: The Drover's Wife
  author: Henry Lawson
  author_died: 1922
  first_published: 1892-07-23 (The Bulletin); collected in While the Billy Boils, 1896
  source_url: https://archive.org/details/lawsonwhilethebillyboils
  checked_against: https://en.wikisource.org/wiki/While_the_Billy_Boils/The_Drover%27s_Wife
  words: 3194
  kind: prose
  notes: >-
    Text of the 1896 first edition of While the Billy Boils. Built from the scan-backed Wikisource
    transcription (1913 printing) and diffed word by word against the 1896 OCR, with disputed spots
    checked on the 1896 page scans: they agree except "'All right, mum,'" (1913: "mum.'"),
    "as she said—and" (dash lost in the 1913 transcription) and "18— ruined"; Wikisource also
    repeats the boy's last line after the final paragraph (dropped). Project Gutenberg #7144 is a
    substantially different edition (double quotes, "veranda", "civilization", "sharp-faced urchin"
    without "excited", "King Jimmy", "possums", "blarst me", etc.) and was not followed. Section
    breaks "* * * * *" as printed. Contains period racial terms ("gin", "blackfellow") as written.

