# Classic Australian texts kept in this folder (see README.md). `words` counts whitespace-separated
# tokens containing a letter or digit (section-break rows such as ". . . . . ." are not counted).
# `source_url` is the printed edition the text was proofed against (a page scan wherever one was
# available); `checked_against` is the main independent second source. Other sources consulted are
# named in `notes`.
#
# Conventions applied to every file (typographic only, never wording): straight ASCII quotes and
# apostrophes; em-dashes as U+2014 (Project Gutenberg's "--" converted); italics and small capitals
# dropped (PG's CAPS-for-italics lowered); drop-cap openings restored to normal case; verse
# indentation and printers' line wrapping removed; section breaks kept as a row of dots or asterisks
# as printed. Original spelling, dialect spellings, elisions and punctuation are kept as printed,
# including the period practice of opening every line of a continued quotation with a quote mark.

- file: man_from_snowy_river.txt
  licence: public-domain
  title: The Man from Snowy River
  author: A. B. "Banjo" Paterson
  author_died: 1941
  first_published: 1890-04-26 (The Bulletin); collected in The Man from Snowy River and Other Verses, 1895
  source_url: https://archive.org/details/cu31924009183298
  checked_against: https://en.wikisource.org/wiki/The_Man_from_Snowy_River_and_Other_Verses/The_Man_from_Snowy_River
  words: 1045
  kind: poem
  notes: >-
    Text of the 1896 Angus & Robertson / Macmillan printing of the first collection, proofed page by
    page against the archive.org scan. Started from the Wikisource transcription (1908 printing),
    which omits three of the scan's running quotation marks ('For a long..., ...mountain bred.',
    'No man can hold...); restored from the scan. Project Gutenberg #213 drops all running quotes and
    prints "NO man" (italic No in the scan). No wording differences between the three.

- file: clancy_of_the_overflow.txt
  licence: public-domain
  title: Clancy of the Overflow
  author: A. B. "Banjo" Paterson
  author_died: 1941
  first_published: 1889-12-21 (The Bulletin); collected 1895
  source_url: https://archive.org/details/cu31924009183298
  checked_against: https://en.wikisource.org/wiki/The_Man_from_Snowy_River_and_Other_Verses/Clancy_of_The_Overflow
  words: 366
  kind: poem
  notes: >-
    1896 printing, proofed against the scan. Wikisource (1908 printing) has "for want of better,"
    (comma), omits the closing quote after "where he are." and the period after "foulness over all";
    PG #213 has 'on spec', and 'The Overflow'. (quote outside the comma/period). All resolved to the
    1896 scan: "better" (no comma), 'on spec,', "he are.'", "over all.", "Overflow.'". Section breaks
    printed as a row of dots. "fœtid" keeps the printed ligature (PG: foetid).

