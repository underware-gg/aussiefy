- file: sentimental_bloke_spring_song.txt
  licence: public-domain
  title: A Spring Song (The Songs of a Sentimental Bloke, canto I)
  author: C. J. Dennis
  author_died: 1938
  first_published: 1915 (The Songs of a Sentimental Bloke, Angus & Robertson)
  source_url: https://archive.org/details/cu31924013248558
  checked_against: https://www.gutenberg.org/ebooks/4730
  words: 687
  kind: poem
  notes: >-
    Text of the 1916 Angus & Robertson printing, proofed line by line against the archive.org scan
    (pp. 13-16). PG #4730 is the same text but with errors, all corrected from the scan: wrong line
    break at "I'm sick / Of that cheap tart"; "gettin'" for "gittin'"; "wish't" for "wisht"; "Little
    Lon.," for "Little Lons.,"; "doing" for "doin'"; "An," and "An wot's" for "An'"; missing dashes
    after "I would", "sweet skirt", "gardings 'ere"; missing comma in "The parks, an' gardings";
    three- vs four-dot ellipses at "choke....", "carst....", "breeze....". Wikisource's scan-backed
    1917 printing (https://en.wikisource.org/wiki/The_Songs_of_a_Sentimental_Bloke/I._A_Spring_Song)
    has Dennis's later revisions ("Uv" for "Of", "sort o'" for "sorter", "Gawstruth", "'is phiz") and
    was used only to arbitrate punctuation. Ellipses written without a leading space.

- file: sentimental_bloke_intro.txt
  licence: public-domain
  title: The Intro (The Songs of a Sentimental Bloke, canto II)
  author: C. J. Dennis
  author_died: 1938
  first_published: 1915 (The Songs of a Sentimental Bloke, Angus & Robertson)
  source_url: https://archive.org/details/cu31924013248558
  checked_against: https://www.gutenberg.org/ebooks/4730
  words: 832
  kind: poem
  notes: >-
    1916 printing, proofed line by line against the scan (pp. 19-23). Corrected PG #4730 errors:
    "Doreen ...Well spare" (comma missing), "perlite." for "perlite,", "found'er", "'cad" for "'ead",
    "she was square" for "wus", "done a duck" (period missing), "toff" (dash missing), "so shy." for
    "shy,", "I was a tiny" for "wus", "Fer me ole pot" for "my", "'struth" for "struth", "bloke'll"
    for "bloke 'll", "dunno'ow", "out...She's" for "out.... She's", "me-that" for "me—that".
    Note the scan keeps both "Where she was in a job" and "she wus square", and "lef'" with its
    apostrophe (the 1917 Wikisource text and the 1916 OCR both drop it). 1917 revisions ("yeh'd",
    "jist", "fer", "Saturd'y", "Gawstruth", ...) not followed.

- file: sentimental_bloke_glossary.txt
  licence: public-domain
  title: The Glossary (The Songs of a Sentimental Bloke)
  author: C. J. Dennis
  author_died: 1938
  first_published: 1915 (The Songs of a Sentimental Bloke; this combined glossary for the Bloke and Ginger Mick from 1916-17 printings)
  source_url: https://en.wikisource.org/wiki/The_Songs_of_a_Sentimental_Bloke/The_Glossary
  checked_against: https://archive.org/details/cu31924013248558
  words: 2358
  kind: prose
  notes: >-
    Dennis's own glossary, one entry per line, headed by its line "For use with 'The Sentimental
    Bloke' and 'Ginger Mick.'" Transcription of the 1917 printing (Wikisource, scan-backed), diffed
    against the OCR of the 1916 printing: the transcription had dropped the dash after sub-entry
    headwords (e.g. "To do a bunk.—To depart."), restored in 7 entries, and garbled "Chip.—To
    'chat,' q.v." (fixed). Remaining 1916/1917 differences are minor wording and order (1916:
    "Bellers (Bellows)", no "A fair cow" sub-entry, "etc." for "&c.", a few entries in a different
    order); the 1917 wording is kept. PG #4730's glossary is a third variant ("--" layout,
    "Australian Imperial Force") and was not used.

- file: said_hanrahan.txt
  licence: public-domain
  title: Said Hanrahan
  author: John O'Brien (P. J. Hartigan)
  author_died: 1952
  first_published: 1919-07-31 (The Catholic Press); collected in Around the Boree Log and Other Verses, 1921
  source_url: https://gutenberg.net.au/ebooks05/0500051.txt
  checked_against: https://en.wikisource.org/wiki/Said_Hanrahan
  words: 481
  kind: poem
  notes: >-
    Project Gutenberg Australia text of Around the Boree Log; Wikisource agrees word for word (but
    is not scan-backed and may derive from it). PGA's single hyphen for a dash ("speak-") written
    as "speak—". Not proofed against a scan: archive.org's copies are loan-only and Trove blocked
    automated access. The poem as quoted on Wikipedia (https://en.wikipedia.org/wiki/Said_Hanrahan)
    differs in "It's lookin' crook", "We want a inch of rain" and "Back-o'Bourke" - possibly the 1919
    newspaper text; unverified, so the 1921 book text is kept.

- file: on_our_selection_ch1.txt
  licence: public-domain
  title: Starting the Selection (On Our Selection, chapter I)
  author: Steele Rudd (Arthur Hoey Davis)
  author_died: 1935
  first_published: 1895 (The Bulletin); collected in On Our Selection!, 1899
  source_url: https://archive.org/details/onourselection00rudd
  checked_against: https://en.wikisource.org/wiki/On_Our_Selection/Chapter_1
  words: 1255
  kind: prose
  notes: >-
    Text of the 1899 first edition (Bulletin Newspaper Co.), from the scan-backed Wikisource
    transcription of the 1903 fourth edition, diffed against the 1899 OCR and checked on the 1899
    page scans. Both transcription and OCR misread "all th' hair had comed off" as "corned" (scan:
    "comed"). PG #3677 differs: "seventy pounds" (print: "£70"), "every tree and sapling that had
    grown there" (print: "grew"), "backs", "were n't", "started,;", "WAS" for italic "was", no comma
    after "cow-dung" - all resolved to the 1899 print. The print sets contractions with a thin space
    ("did n't", "he 'd", "they 've"); these are written closed. "ironbark" as in the 1903 text (the
    1899 print hyphenates it across a line break). Chapter heading and the illustration caption
    ("On the Road to our Selection") omitted.

