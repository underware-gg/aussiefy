# Provenance of every reference text. Historical editions are public domain in Australia and the US
# (published before 1929, every named author and translator died in or before 1955). The modern Bible
# translation is explicitly dedicated to the public domain. The two Goldilocks retellings are own work.
#
# Text from a Project Gutenberg file is verbatim except: Gutenberg
# headers/licence removed, _italic_ underscores dropped, [Illustration] notes
# removed, hard-wrapped prose lines joined into one line per paragraph, and
# verse indentation stripped (line breaks kept). Quotation marks, dashes ("--"
# or "—") and spelling are as in each source file.
# edition_year is the year of the printed edition the Gutenberg file reproduces
# (null when Gutenberg does not identify it); see notes for first publication.

